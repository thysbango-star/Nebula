name: Build Nebula APK

on:
  push:
    branches: [main, nebula-2.0]
    paths-ignore:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Use signing key
        id: sign
        env:
          NEBULA_KEY_PASSWORD: ${{ secrets.NEBULA_KEY_PASSWORD }}
        run: |
          if [ -n "$NEBULA_KEY_PASSWORD" ]; then
            echo "NEBULA_KEYSTORE=$GITHUB_WORKSPACE/signing/nebula.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NEBULA_KEY_PASSWORD secret not set. Building to check the code, but not publishing."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          NEBULA_KEY_PASSWORD: ${{ secrets.NEBULA_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk Nebula.apk

      - name: Save build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload test APK (branch builds)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Nebula-test-apk
          path: Nebula.apk

      - name: Publish release
        if: steps.sign.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Nebula 2.0.${{ github.run_number }}
          body: |
            **Install on your phone:** tap **Nebula.apk** below, open it, and allow installing from your browser if asked.
            Built from ${{ github.sha }}.
          files: Nebula.apk
          make_latest: true
