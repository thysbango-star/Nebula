name: Build Nebula for Windows and Linux

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check scripts
        run: npm run check

      - name: Test the wake word engine on Windows
        run: node test/kws-test.js

      - name: Test the R3cket helper on Windows
        run: node test/win-helper-test.js

      - name: Test the background listening process (wake word + question recording)
        run: node test/ears-test.js

      - name: Test the sports watcher (live scores + goal detection)
        run: node test/sports-test.js

      - name: Test Nebula Beam (encrypted transfer, consent, limits, mDNS packets)
        run: node test/beam-test.js

      - name: Test Voice Interrupt (echo ignored, interruptions caught and understood)
        run: node test/interrupt-test.js

      - name: Test Mood PLAY (TV server, codes, remote commands, opening on a Samsung TV)
        run: node test/moodplay-test.js
      - name: Workspace (RovBots) test
        run: node test/workspace-test.js
      - name: MCP connections test (stdio + remote servers, permissions, approvals)
        run: node test/mcp-test.js
      - name: Calls with bots test (who answers, hand-overs, tasks, interrupting)
        run: node test/call-test.js

      - name: Test the document writers (docx, xlsx, pptx, csv, md, txt, html)
        run: node test/docs-test.js

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Collect files
        shell: bash
        run: |
          ls -la dist
          test -f dist/Nebula-Setup.exe
          test -f dist/Nebula-Portable.exe
          node -e "require('fs').writeFileSync('dist/latest.json', JSON.stringify({version: require('./package.json').version, notes: process.argv[1]}))" "$(git log -1 --pretty=%s)"

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula-Windows
          path: |
            desktop/dist/Nebula-Setup.exe
            desktop/dist/Nebula-Portable.exe

      - name: Publish (fixed "desktop" download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop
          name: Nebula for Windows and Linux
          make_latest: false
          body: |
            **Windows:** download **Nebula-Setup.exe** and run it.
            Windows may say "Windows protected your PC" because the app isn't code-signed: click **More info → Run anyway**.
            Or use **Nebula-Portable.exe** to run it without installing.
            **Linux:** download **Nebula-Linux.AppImage** (make it executable and run it) or install **Nebula-Linux.deb**. For music in the island, install `playerctl`.
            Built from ${{ github.sha }}.
          files: |
            desktop/dist/Nebula-Setup.exe
            desktop/dist/Nebula-Portable.exe
            desktop/dist/latest.json

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check scripts
        run: npm run check

      - name: Test the wake word engine on Linux
        run: node test/kws-test.js

      - name: Test the sports watcher
        run: node test/sports-test.js

      - name: Test Nebula Beam
        run: node test/beam-test.js

      - name: Test Voice Interrupt
        run: node test/interrupt-test.js

      - name: Test Mood PLAY (TV server, codes, remote commands, opening on a Samsung TV)
        run: node test/moodplay-test.js
      - name: Workspace (RovBots) test
        run: node test/workspace-test.js
      - name: MCP connections test (stdio + remote servers, permissions, approvals)
        run: node test/mcp-test.js
      - name: Calls with bots test (who answers, hand-overs, tasks, interrupting)
        run: node test/call-test.js

      - name: Test the Linux media reader (playerctl)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq playerctl > /dev/null
          node -e "const {LinuxMedia}=require('./src/linux');new LinuxMedia().media().then(m=>{console.log('media:',JSON.stringify(m));if(!m||typeof m!=='object')process.exit(1)})"

      - name: Build AppImage and .deb
        run: npm run dist:linux

      - name: Collect files
        run: |
          ls -la dist
          test -f dist/Nebula-Linux.AppImage
          test -f dist/Nebula-Linux.deb

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula-Linux
          path: |
            desktop/dist/Nebula-Linux.AppImage
            desktop/dist/Nebula-Linux.deb

      - name: Publish (same "desktop" download page)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop
          make_latest: false
          files: |
            desktop/dist/Nebula-Linux.AppImage
            desktop/dist/Nebula-Linux.deb
