name: Notch film

# Records every notch animation from the real composables (Robolectric, test clock, 30 fps) into one video.
# The video is uploaded as an artifact and committed to the `notch-film` branch so it can be fetched with git.

on:
  push:
    branches: [nebula-2.0]
    paths:
      - 'app/src/main/java/com/nebula/assistant/notch/**'
      - 'app/src/test/**'
      - '.github/workflows/notch-film.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notch-film
  cancel-in-progress: true

jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: ESPN logos for the reel
        run: |
          mkdir -p build/film-logos && cd build/film-logos
          B=https://site.api.espn.com/apis/site/v2/sports
          : > map.tsv
          pick() { # league path, keys...
            path=$1; shift
            curl -sfL "$B/$path/teams" | jq -r '.sports[0].leagues[0].teams[].team | [(.displayName|ascii_downcase|gsub("[^a-z]";"")), (.logos[0].href // "")] | @tsv' > teams.tsv || true
            for k in "$@"; do grep -m1 "^$k" teams.tsv | awk -v k="$k" -F'\t' '{print k"\t"$2}' >> map.tsv || true; done
            lg=$(curl -sfL "$B/$path/scoreboard" | jq -r '.leagues[0].logos[0].href // empty' || true)
            [ -n "$lg" ] && printf '%s\t%s\n' "$2league" "$lg" >> map.tsv || true
          }
          pick soccer/eng.1 arsenal chelsea brighton newcastle
          pick rugby/289234 southafrica england
          sed -i 's/^chelsealeague/league/; s/^englandleague/rugbyleague/' map.tsv
          while IFS=$'\t' read -r k u; do [ -n "$u" ] && curl -sfL "$u" -o "$k.png" || true; done < map.tsv
          cat map.tsv; ls -la

      - name: Record
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.nebula.assistant.notch.NotchFilm' -Pfilm -Pffmpeg="$(which ffmpeg)" -PfilmLogos="$PWD/build/film-logos" 2>&1 | tee film.log
          ls -la build/notch-film | head -20

      - name: Save log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: film-log
          path: |
            film.log
            app/build/reports/tests

      - uses: actions/upload-artifact@v4
        with:
          name: notch-animations
          path: |
            build/notch-film/notch-animations.mp4
            build/notch-film/still-*.png

      - name: Publish to the notch-film branch
        run: |
          mkdir /tmp/film && cp build/notch-film/notch-animations.mp4 build/notch-film/still-*.png /tmp/film/
          cd /tmp/film
          git init -q -b notch-film
          git config user.name "Nebula CI"; git config user.email "ci@nebula.local"
          git add . && git commit -q -m "Notch film from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" notch-film
