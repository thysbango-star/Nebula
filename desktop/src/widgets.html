<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Nebula widget</title>
<style>
  :root { --ink: #fff; --dim: rgba(255,255,255,.62); --faint: rgba(255,255,255,.38); --acc: #5ad1ff; --acc2: #a55cff; --line: rgba(255,255,255,.1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden; user-select: none; }
  body { font: 500 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--ink); padding: 6px; }
  .num { font-family: "Bahnschrift", "Roboto Condensed", "Segoe UI", sans-serif; font-weight: 700; }

  /* the glass card: dark, a bright top rim, a soft bevel and a little Nebula light in the corner */
  .card { position: relative; height: 100%; border-radius: 26px; overflow: hidden; -webkit-app-region: drag;
    background: linear-gradient(160deg, rgba(34,34,44,.94), rgba(12,12,16,.96));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.07), 0 10px 30px rgba(0,0,0,.35); }
  .card::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 80% at 100% 0%, rgba(90,209,255,.14), transparent 55%), radial-gradient(90% 70% at 0% 100%, rgba(165,92,255,.12), transparent 60%); }
  .card::after { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(rgba(255,255,255,.06), transparent 24%, transparent 80%, rgba(0,0,0,.16)); }
  .in { position: relative; z-index: 1; height: 100%; padding: 16px 18px; display: flex; flex-direction: column; }
  button, input, .tap { -webkit-app-region: no-drag; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .hd { display: flex; align-items: center; gap: 8px; font: 700 11px/1 "Segoe UI", sans-serif; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim); }
  .hd .dot { width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, var(--acc), var(--acc2)); box-shadow: 0 0 10px var(--acc); }
  .hd .r { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--faint); }
  .empty { margin: auto 0; color: var(--dim); font-size: 13px; }
  .empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 3px; }

  /* orb (voice) */
  .orb { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; position: relative;
    background: radial-gradient(circle at 35% 30%, #8fe6ff, #3b7bff 45%, #6d2bd9 80%); box-shadow: 0 0 0 1px rgba(255,255,255,.25) inset, 0 10px 30px rgba(77,140,255,.45);
    transition: transform .2s cubic-bezier(.3,1.6,.5,1); }
  .orb:hover { transform: scale(1.06); } .orb:active { transform: scale(.94); }
  .orb svg { width: 30px; height: 30px; }
  .orb.on::before, .orb.on::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid rgba(120,220,255,.6); animation: ring 1.6s ease-out infinite; }
  .orb.on::after { animation-delay: .8s; }
  @keyframes ring { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
  .voice .in { align-items: center; justify-content: center; gap: 12px; padding: 14px; }
  .voice .lbl { font: 600 13px/1 "Segoe UI", sans-serif; color: var(--dim); }

  /* music */
  .back { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(34px) saturate(1.3); opacity: .55; transform: scale(1.3); transition: opacity .8s; }
  .tint { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
  .music .in { flex-direction: row; align-items: center; gap: 16px; padding: 16px; }
  .art { width: 112px; height: 112px; border-radius: 22px; flex: none; overflow: hidden; background: linear-gradient(135deg, #2a2a38, #12121a); display: grid; place-items: center;
    box-shadow: 0 12px 26px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.18); position: relative; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, rgba(255,255,255,.22), transparent 55%); }
  .art.bloom img { animation: bloom .6s cubic-bezier(.2,.8,.2,1); } @keyframes bloom { from { filter: blur(12px); transform: scale(.88); opacity: 0; } to { filter: none; transform: none; opacity: 1; } }
  .mi { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ti { font: 700 17px/1.2 "Segoe UI Variable Display", "Segoe UI", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ar { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .ctl { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .ctl button { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; transition: transform .15s; } .ctl button:hover { transform: scale(1.1); }
  .ctl .pp { width: 40px; height: 40px; background: rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 0 0 1px rgba(255,255,255,.08); }
  .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); margin-top: 12px; overflow: hidden; } .bar i { display: block; height: 100%; background: #fff; border-radius: 2px; transition: width .5s linear; }
  .times { display: flex; justify-content: space-between; color: var(--faint); font: 600 10.5px/1 "Segoe UI", sans-serif; margin-top: 4px; }

  /* ask */
  .field { display: flex; align-items: center; gap: 8px; margin-top: 10px; background: rgba(255,255,255,.08); border-radius: 16px; padding: 4px 4px 4px 14px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  .field input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--ink); font: 500 14px/1 "Segoe UI", sans-serif; padding: 8px 0; }
  .field input::placeholder { color: var(--faint); }
  .send { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, var(--acc), var(--acc2)); }
  .chips { display: flex; gap: 6px; margin-top: 9px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-app-region: no-drag; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; padding: 6px 11px; border-radius: 12px; background: rgba(255,255,255,.07); color: var(--dim); font: 600 11.5px/1 "Segoe UI", sans-serif; }
  .chip:hover { background: rgba(255,255,255,.13); color: var(--ink); }

  /* tasks */
  .list { margin-top: 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; overflow: hidden; }
  .task { display: flex; align-items: center; gap: 10px; padding: 7px 4px; border-radius: 10px; cursor: pointer; }
  .task:hover { background: rgba(255,255,255,.06); }
  .task .st { width: 18px; height: 18px; flex: none; border-radius: 50%; display: grid; place-items: center; }
  .task .st.run { border: 2px solid rgba(90,209,255,.3); border-top-color: var(--acc); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .task .st.ok { background: #34d27b; } .task .st.bad { background: #ef4444; } .task .st.wait { border: 2px solid #f5b400; }
  .task .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task .tt small { display: block; color: var(--faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .add { margin-top: 8px; align-self: flex-start; padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.08); color: var(--ink); font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .add:hover { background: rgba(255,255,255,.14); }

  /* sports */
  .sbg { position: absolute; inset: 0; opacity: .9; }
  .board { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 10px; flex: 1; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
  .team span { font: 600 12px/1.1 "Segoe UI", sans-serif; color: var(--dim); max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font: 800 13px/1 "Segoe UI", sans-serif; color: #fff; }
  .logo { width: 46px; height: 46px; object-fit: contain; }
  .mid { text-align: center; padding: 0 8px; }
  .score { font-size: 38px; line-height: 1; letter-spacing: 1px; white-space: nowrap; }
  .clock { color: var(--dim); font: 700 12px/1 "Segoe UI", sans-serif; margin-top: 5px; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .live { width: 6px; height: 6px; border-radius: 50%; background: #ff3b30; animation: blink 1s ease-in-out infinite alternate; } @keyframes blink { from { opacity: .3; } }
  .kick { font-size: 26px; line-height: 1; } .kick small { display: block; font: 600 11px/1.2 "Segoe UI", sans-serif; color: var(--dim); margin-top: 4px; }

  /* daily */
  .day { font: 700 30px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; margin-top: 6px; }
  .date { color: var(--dim); margin-top: 3px; }
  .rows { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
  .row { display: flex; align-items: center; gap: 10px; min-width: 0; cursor: pointer; }
  .row .ic { width: 28px; height: 28px; border-radius: 9px; flex: none; display: grid; place-items: center; background: rgba(255,255,255,.08); overflow: hidden; }
  .row .ic img { width: 100%; height: 100%; object-fit: cover; }
  .row .tx { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .tx small { color: var(--faint); margin-left: 4px; }
  .mini-orb { position: absolute; right: 16px; top: 16px; width: 44px; height: 44px; z-index: 2; }
  .mini-orb .orb { width: 44px; height: 44px; } .mini-orb svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<div class="card" id="card"><div class="in" id="in"></div></div>
<script>
'use strict';
const api = window.nebula;
const KIND = new URLSearchParams(location.search).get('w') || 'voice';
document.getElementById('card').classList.add(KIND);
const $in = document.getElementById('in');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const act = (m) => api.send('widget:act', m);
let S = {};

const MIC = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>';
const ICON = {
  prev: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>',
  next: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>',
  play: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
  pause: '<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg>',
  send: '<svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M3 20.5 21 12 3 3.5v6.6l12 1.9-12 1.9z"/></svg>',
  plus: '<svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>',
  note: '<svg width="34" height="34" viewBox="0 0 24 24" fill="rgba(255,255,255,.5)"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6Z"/></svg>',
};
const clock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const mediaPos = (m) => Math.min(m.dur || Infinity, m.playing ? (m.pos || 0) + Math.max(0, Date.now() - (m.at || Date.now())) : m.pos || 0);
const badge = (sd, px = 46) => sd.logo ? `<img class="logo" src="${esc(sd.logo)}" alt="" style="width:${px}px;height:${px}px" onerror="this.outerHTML='<div class=&quot;badge&quot; style=&quot;background:${esc(sd.color || '#555')}&quot;>${esc((sd.abbr || '').slice(0, 4))}</div>'">`
  : `<div class="badge" style="width:${px}px;height:${px}px;background:linear-gradient(135deg, ${esc(sd.color || '#555')}, rgba(0,0,0,.35))">${esc((sd.abbr || '').slice(0, 4))}</div>`;
const live = () => (S.games || []).find((g) => g.live) || (S.games || [])[0] || null;
const nextFixture = () => (S.fixtures || []).find((g) => g.state === 'pre') || null;
const dayOf = (t) => { const d = new Date(t), now = new Date(); const days = Math.round((new Date(d.toDateString()) - new Date(now.toDateString())) / 864e5);
  return days === 0 ? 'Today' : days === 1 ? 'Tomorrow' : d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' }); };
const when = (t) => { const d = new Date(t), now = new Date(); const tm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const days = Math.round((new Date(d.toDateString()) - new Date(now.toDateString())) / 864e5);
  return days === 0 ? `Today ${tm}` : days === 1 ? `Tomorrow ${tm}` : `${d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' })} ${tm}`; };

// ------------------------------------------------------------------ each widget
const R = {
  voice() {
    const on = !!S.session?.active;
    const phase = S.session?.phase;
    $in.innerHTML = `<button class="orb tap ${on ? 'on' : ''}" id="go" title="Ask Nebula">${MIC}</button>
      <div class="lbl">${on ? ({ listening: 'Listening…', thinking: 'Thinking…', speaking: 'Speaking' })[phase] || 'Nebula' : 'Ask Nebula'}</div>`;
    document.getElementById('go').onclick = () => act({ do: 'voice' });
  },

  music() {
    const m = S.media;
    if (!m) { $in.innerHTML = '<div class="hd"><i class="dot"></i>Music</div><div class="empty"><b>Nothing playing</b>Play something in Spotify, YouTube or any app.</div>'; R.lastTitle = ''; return; }
    if (!document.getElementById('mi') || R.lastTitle !== m.title) {
      const fresh = R.lastTitle !== m.title; R.lastTitle = m.title;
      document.querySelectorAll('.back,.tint').forEach((e) => e.remove());
      if (m.art) document.getElementById('card').insertAdjacentHTML('afterbegin', `<div class="back" style="background-image:url('${m.art}')"></div><div class="tint"></div>`);
      $in.innerHTML = `<div class="art ${fresh ? 'bloom' : ''}">${m.art ? `<img src="${m.art}" alt="">` : ICON.note}</div>
        <div class="mi" id="mi"><div class="ti" title="${esc(m.title)}">${esc(m.title)}</div><div class="ar">${esc(m.artist || '')}</div>
          <div class="ctl"><button data-m="prev">${ICON.prev}</button><button class="pp" data-m="toggle" id="pp"></button><button data-m="next">${ICON.next}</button></div>
          <div class="bar"><i id="fill"></i></div><div class="times"><span id="pos"></span><span id="left"></span></div></div>`;
      $in.querySelectorAll('[data-m]').forEach((b) => (b.onclick = () => act({ do: 'media', what: b.dataset.m })));
    }
    document.getElementById('pp').innerHTML = m.playing ? ICON.pause : ICON.play;
    R.tickMusic();
  },
  tickMusic() {
    const m = S.media; const f = document.getElementById('fill'); if (!m || !f) return;
    const p = mediaPos(m); f.style.width = m.dur ? `${Math.min(100, (p / m.dur) * 100)}%` : '0%';
    document.getElementById('pos').textContent = clock(p); document.getElementById('left').textContent = m.dur ? `-${clock(m.dur - p)}` : '';
  },

  ask() {
    if (document.getElementById('q')) return; // don't wipe what you're typing
    const ideas = [['Explain something', 'Explain '], ['Summarise', 'Summarise '], ['What should I do today?', 'What should I do today?'], ['Help me study', 'Help me study ']];
    $in.innerHTML = `<div class="hd"><i class="dot"></i>Ask Nebula</div>
      <form class="field" id="f"><input id="q" placeholder="Ask anything…" autocomplete="off"><button class="send" title="Ask">${ICON.send}</button></form>
      <div class="chips">${ideas.map(([l, p]) => `<button class="chip" data-p="${esc(p)}">${esc(l)}</button>`).join('')}</div>`;
    const q = document.getElementById('q');
    document.getElementById('f').onsubmit = (e) => { e.preventDefault(); const t = q.value.trim(); if (!t) return q.focus(); act({ do: 'ask', text: t }); q.value = ''; };
    // Finished prompts go straight away; the open-ended ones fill the box so you can finish the sentence.
    $in.querySelectorAll('[data-p]').forEach((b) => (b.onclick = () => { const p = b.dataset.p; if (p.endsWith('?')) act({ do: 'ask', text: p }); else { q.value = p; q.focus(); } }));
  },

  tasks() {
    const ts = S.tasks || [];
    const running = ts.filter((t) => t.status === 'IN_PROGRESS').length;
    const icon = (t) => ({ IN_PROGRESS: 'run', COMPLETED: 'ok', FAILED: 'bad', CANCELLED: 'bad', REQUIRES_INPUT: 'wait' })[t.status] || 'wait';
    const sub = (t) => t.status === 'IN_PROGRESS' ? `${Math.round((t.progress || 0) * 100)}% · working` : t.status === 'REQUIRES_INPUT' ? 'Needs your answer'
      : t.status === 'FAILED' ? 'Didn’t finish' : t.status === 'CANCELLED' ? 'Cancelled' : (t.summary || 'Done');
    $in.innerHTML = `<div class="hd"><i class="dot"></i>Tasks<span class="r">${running ? `${running} running` : `${ts.length} recent`}</span></div>
      ${ts.length ? `<div class="list">${ts.slice(0, 3).map((t) => `<div class="task tap" data-id="${esc(t.id)}"><i class="st ${icon(t)}"></i><div class="tt">${esc(t.title)}<small>${esc(sub(t))}</small></div></div>`).join('')}</div>`
        : '<div class="empty"><b>No tasks yet</b>Ask Nebula to do something — make a document, research, plan.</div>'}
      <button class="add" id="add">${ICON.plus}New task</button>`;
    $in.querySelectorAll('[data-id]').forEach((e) => (e.onclick = () => act({ do: 'open', view: 'tasks', id: e.dataset.id })));
    document.getElementById('add').onclick = () => act({ do: 'open', view: 'chat' });
  },

  sports() {
    const g = live(), f = !g && nextFixture();
    document.querySelectorAll('.sbg').forEach((e) => e.remove());
    const x = g || f;
    if (!x) {
      $in.innerHTML = `<div class="hd"><i class="dot"></i>Sports</div><div class="empty">${S.following ? '<b>No match this week</b>Your teams’ next game shows here.' : '<b>Follow your teams</b>Settings → Sports.'}</div>`;
      return;
    }
    document.getElementById('card').insertAdjacentHTML('afterbegin', `<div class="sbg" style="background:linear-gradient(90deg, ${x.home.color}cc, #0d0d10 50%, ${x.away.color}cc)"></div>`);
    const mid = g ? `<div class="score num">${esc(g.home.text ?? g.home.score)}&nbsp;–&nbsp;${esc(g.away.text ?? g.away.score)}</div><div class="clock">${g.live ? '<i class="live"></i>' : ''}${esc(g.clock)}</div>`
      : `<div class="kick num">${esc(new Date(f.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))}<small>${esc(dayOf(f.start))}</small></div>`;
    $in.innerHTML = `<div class="hd"><i class="dot"></i>${esc(x.league?.name || 'Sports')}<span class="r">${g ? (g.live ? 'Live' : esc(g.clock)) : 'Next'}</span></div>
      <div class="board tap" id="b"><div class="team">${badge(x.home)}<span>${esc(x.home.name)}</span></div><div class="mid">${mid}</div><div class="team">${badge(x.away)}<span>${esc(x.away.name)}</span></div></div>`;
    document.getElementById('b').onclick = () => act({ do: 'open', view: 'settings' });
  },

  daily() {
    const now = new Date(), h = now.getHours();
    const hi = h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening';
    const name = S.userName ? `, ${S.userName}` : '';
    const ts = S.tasks || [];
    const today = ts.filter((t) => new Date(t.updatedAt).toDateString() === now.toDateString());
    const run = ts.find((t) => t.status === 'IN_PROGRESS') || ts.find((t) => t.status === 'REQUIRES_INPUT');
    const g = live(), f = !g && nextFixture(), m = S.media;
    const rows = [];
    if (m) rows.push(`<div class="row tap" data-go="music"><div class="ic">${m.art ? `<img src="${m.art}" alt="">` : '♪'}</div><div class="tx">${esc(m.title)}<small>${esc(m.artist || '')}</small></div></div>`);
    if (g) rows.push(`<div class="row tap" data-go="sports"><div class="ic">⚽</div><div class="tx">${esc(g.home.abbr)} ${esc(g.home.text ?? g.home.score)}–${esc(g.away.text ?? g.away.score)} ${esc(g.away.abbr)}<small>${esc(g.clock)}</small></div></div>`);
    else if (f) rows.push(`<div class="row tap" data-go="sports"><div class="ic">⚽</div><div class="tx">${esc(f.home.name)} v ${esc(f.away.name)}<small>${esc(when(f.start))}</small></div></div>`);
    rows.push(run ? `<div class="row tap" data-go="tasks"><div class="ic"><i class="st run" style="width:14px;height:14px;border-radius:50%;border:2px solid rgba(90,209,255,.3);border-top-color:var(--acc);animation:spin 1s linear infinite;display:block"></i></div><div class="tx">${esc(run.title)}<small>${run.status === 'REQUIRES_INPUT' ? 'needs you' : 'running'}</small></div></div>`
      : `<div class="row tap" data-go="tasks"><div class="ic" style="color:#34d27b;font-weight:800">✓</div><div class="tx">${today.length ? `${today.length} task${today.length > 1 ? 's' : ''} today` : 'No tasks today'}</div></div>`);
    $in.innerHTML = `<div class="mini-orb"><button class="orb tap ${S.session?.active ? 'on' : ''}" id="go" title="Ask Nebula">${MIC}</button></div>
      <div class="hd"><i class="dot"></i>${hi}${esc(name)}</div>
      <div class="day">${now.toLocaleDateString([], { weekday: 'long' })}</div><div class="date">${now.toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' })}</div>
      <div class="rows">${rows.slice(0, 3).join('')}</div>`;
    document.getElementById('go').onclick = () => act({ do: 'voice' });
    $in.querySelectorAll('[data-go]').forEach((e) => (e.onclick = () => act({ do: 'open', view: e.dataset.go === 'tasks' ? 'tasks' : e.dataset.go === 'sports' ? 'settings' : 'chat' })));
  },
};

function render() { try { R[KIND](); } catch (e) { console.error(e); } }
api.on('widget:state', (s) => { S = s || {}; render(); });
setInterval(() => { if (KIND === 'music') R.tickMusic(); if (KIND === 'daily' && new Date().getSeconds() === 0) render(); }, 1000);
render();
</script>
</body>
</html>
