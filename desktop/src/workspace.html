<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
<title>Nebula Workspace</title>
<style>
@font-face { font-family: "NB Open Sans"; src: url(fonts/OpenSans.ttf) format("truetype"); font-weight: 300 800; font-stretch: 75% 100%; }
@font-face { font-family: "NB Lora"; src: url(fonts/LoraItalic.ttf) format("truetype"); font-weight: 400 700; font-style: italic; }
@font-face { font-family: "NB Manrope"; src: url(fonts/manrope.ttf) format("truetype"); font-weight: 200 800; }
:root {
  --brand: #5200F4; --accent: #8B5CFF; --accent2: #B79CFF;
  --bg: #0A0910; --bg2: #100F17; --card: #15141D; --card2: #1B1A25; --hover: #22202E; --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.12);
  --text: #F3F1F8; --dim: #A29EB3; --faint: #6E6A80;
  --ok: #34D399; --warn: #FACB34; --bad: #FF5D6C; --coral: #FD715F; --teal: #2DBFCD;
  --r: 18px; --r2: 12px;
  --ui: "NB Manrope", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --serif: "NB Lora", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 500 14px/1.45 var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; }
input, textarea, select, button { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
textarea, input[type=text], input[type=url], input[type=number], input[type=date], input[type=time], input[type=search], input[type=datetime-local], select {
  background: var(--bg2); border: 1px solid var(--line2); border-radius: 12px; padding: 10px 12px; outline: none; width: 100%; user-select: text; }
textarea:focus, input:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 70px; line-height: 1.45; }
select option { background: var(--card); }
::selection { background: rgba(139,92,255,.45); }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.09); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
.drag { -webkit-app-region: drag; } .nodrag, .drag button, .drag input { -webkit-app-region: no-drag; }
[hidden] { display: none !important; }

/* ---------------------------------------------------------------- onboarding (the video) */
.onb { position: fixed; inset: 0; z-index: 50; background: #5200F4; color: #fff; font-family: "NB Open Sans", "Open Sans", sans-serif; overflow: hidden; -webkit-app-region: drag; transition: opacity .42s; }
.onb.leaving { opacity: 0; }
.onb input, .onb button { -webkit-app-region: no-drag; }
.scr { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: transform .62s cubic-bezier(.65,0,.25,1), opacity .5s; will-change: transform, opacity; }
.scr.on { opacity: 1; transform: none; pointer-events: auto; }
.scr.from-h { transform: translateX(100%); opacity: 1; transition: none; } .scr.out-h { transform: translateX(-100%); opacity: 1; }
.scr.from-v { transform: translateY(100%); opacity: 1; transition: none; } .scr.out-v { transform: translateY(-100%); opacity: 1; }
.scr.from-f { transform: scale(.985); opacity: 0; transition: none; } .scr.out-f { opacity: 0; }
.mid { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-58%); text-align: center; display: flex; flex-direction: column; align-items: center; }
.mid.up { transform: translateY(-96%); }
.onb h1 { font-size: clamp(34px, 5.6vw, 92px); font-weight: 800; margin: 0; letter-spacing: -.01em; font-stretch: 100%; }
.onb h2 { font-size: clamp(26px, 4.4vw, 86px); font-weight: 750; margin: 0 0 1.4vw; }
.scr[data-s=ready] h2 { font-size: clamp(28px, 5.2vw, 100px); margin-bottom: 2.4vw; }
.onb h2.big { font-size: clamp(30px, 5.4vw, 104px); }
.onb .sub { font-size: clamp(16px, 2.6vw, 44px); font-weight: 700; margin: .2em 0 0; }
.onb .bar { width: 82vw; height: clamp(30px, 4.6vw, 80px); border-radius: 99px; background: #fff; overflow: hidden; position: relative; }
.onb .bar i { position: absolute; inset: 0; background: linear-gradient(90deg, #EDE5FF, #fff); transform-origin: left; transform: scaleX(.04); }
.onb .pill { width: clamp(260px, 27vw, 520px); height: clamp(40px, 3.6vw, 62px); border-radius: 99px; background: #fff; border: 2.5px solid #3F3A5A; color: #1A1530; text-align: center; font-size: clamp(16px, 1.5vw, 26px); font-weight: 700; padding: 0 1.4em; }
.onb .pill.wide { width: clamp(300px, 32vw, 640px); height: clamp(48px, 4.4vw, 78px); }
.onb .pill:focus { border-color: #1A1530; box-shadow: 0 0 0 4px rgba(255,255,255,.25); }
.onb .hint { opacity: .55; font-size: 13px; font-weight: 600; margin: 14px 0 0; }
.onb .pair { display: flex; gap: 14vw; align-items: center; justify-content: center; margin-top: 2vw; }
.onb .chip { min-width: clamp(130px, 9.4vw, 190px); height: clamp(28px, 1.9vw, 36px); border-radius: 99px; background: #fff; color: #1A1530; border: 2px solid #3F3A5A; font-size: clamp(12px, .95vw, 17px); font-weight: 600; padding: 0 1.2em; transition: transform .15s, background .15s; }
.onb .chip:hover { transform: translateY(-1px); background: #F1ECFF; }
.onb .chip.small { min-width: clamp(110px, 7.4vw, 150px); height: clamp(22px, 1.5vw, 30px); font-size: clamp(11px, .8vw, 14px); margin-top: .6vw; }
.onb .numwrap { position: relative; display: inline-block; }
.onb .numwrap .in { position: absolute; inset: 0; width: 100%; text-align: center; opacity: 0; pointer-events: none; outline: none; }
.onb .numwrap.on .in { opacity: 1; pointer-events: auto; } .onb .numwrap.on button { opacity: 0; }
.onb .ring { width: clamp(70px, 6.4vw, 110px); height: clamp(70px, 6.4vw, 110px); border-radius: 50%; border: 4px solid transparent; border-top-color: #fff; border-left-color: #fff; border-right-color: rgba(255,255,255,.9); animation: spin 1.1s linear infinite; filter: drop-shadow(0 6px 10px rgba(0,0,0,.25)); }
@keyframes spin { to { transform: rotate(360deg); } }
.mascot { position: absolute; left: 0; bottom: 0; width: 17.5vw; transform: translate(-3%, 14%); }
.mascot svg { display: block; width: 100%; height: auto; }
.pilewrap { position: absolute; left: 50%; bottom: 0; width: 38vw; transform: translate(-50%, 22%); }
.pilewrap svg { width: 100%; height: auto; display: block; }

/* ---------------------------------------------------------------- the intro animation */
.intro { position: fixed; inset: 0; z-index: 60; background: #5200F4; transition: opacity .6s; }
.intro.leaving { opacity: 0; }
.intro canvas { position: absolute; inset: 0; display: block; }
.intro .skip { position: absolute; right: 22px; bottom: 20px; color: rgba(255,255,255,.7); font: 600 13px "NB Open Sans", sans-serif; padding: 8px 14px; border-radius: 99px; background: rgba(255,255,255,.1); }
.intro .skip:hover { background: rgba(255,255,255,.18); color: #fff; }

/* ---------------------------------------------------------------- the workspace */
.app { display: grid; grid-template-columns: 252px 1fr; height: 100vh; background: radial-gradient(1200px 600px at 85% -10%, rgba(82,0,244,.16), transparent 60%), radial-gradient(800px 500px at -10% 110%, rgba(45,191,205,.06), transparent 60%), var(--bg); }
.app.collapsed { grid-template-columns: 72px 1fr; }
.side { display: flex; flex-direction: column; min-height: 0; padding: 12px 12px 12px; border-right: 1px solid var(--line); background: rgba(16,15,23,.72); }
.brand { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px; margin-bottom: 8px; }
.brand .mk { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; flex: none; overflow: hidden; }
.brand .mk svg { width: 26px; height: auto; transform: translate(1px, 3px); }
.brand b { font-size: 14.5px; letter-spacing: -.01em; display: block; line-height: 1.15; } .brand small { display: block; font-size: 10.5px; color: var(--faint); font-weight: 600; }
.collapsed .brand > div, .collapsed .side .lbl, .collapsed .nav button span, .collapsed .side .grow, .collapsed .newbtn span, .collapsed .nav .ct { display: none; }
.newbtn { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--brand); color: #fff; font-weight: 750; margin: 2px 0 10px; justify-content: flex-start; }
.newbtn:hover { filter: brightness(1.12); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { display: flex; align-items: center; gap: 11px; height: 34px; padding: 0 10px; border-radius: 10px; color: var(--dim); font-weight: 650; font-size: 13.5px; text-align: left; position: relative; }
.nav button:hover { background: var(--hover); color: var(--text); }
.nav button.on { background: rgba(139,92,255,.16); color: #fff; }
.nav button.on::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--accent); }
.nav svg { width: 17px; height: 17px; flex: none; }
.nav .ct { margin-left: auto; min-width: 20px; height: 18px; border-radius: 9px; background: var(--warn); color: #1a1530; font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 5px; }
.side .lbl { font-size: 10.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); margin: 16px 10px 6px; display: flex; justify-content: space-between; }
.side .grow { flex: 1; min-height: 0; overflow: auto; margin: 0 -6px; padding: 0 6px; }
.mini { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 8px; border-radius: 10px; color: var(--dim); font-weight: 650; text-align: left; }
.mini:hover { background: var(--hover); color: var(--text); }
.mini .av { width: 24px; height: 24px; }
.mini > span:not(.av) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidefoot { display: flex; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); margin-top: 8px; align-items: center; }
.sidefoot .who { flex: 1; display: flex; align-items: center; gap: 9px; min-width: 0; font-weight: 700; font-size: 13px; }
.sidefoot .who i { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--coral)); display: grid; place-items: center; font-style: normal; font-size: 12px; flex: none; }
.ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--dim); flex: none; }
.ico:hover { background: var(--hover); color: var(--text); }
.ico svg { width: 18px; height: 18px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 150px 0 26px; flex: none; }
.top h1 { font-size: 15px; margin: 0; font-weight: 750; display: flex; align-items: center; gap: 8px; }
.top h1 .crumb { color: var(--faint); font-weight: 650; }
.top .sp { flex: 1; }
.pillbtn { height: 34px; padding: 0 14px; border-radius: 99px; background: var(--card2); border: 1px solid var(--line); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.pillbtn:hover { background: var(--hover); border-color: var(--line2); }
.pillbtn.pri { background: var(--brand); border-color: transparent; color: #fff; } .pillbtn.pri:hover { filter: brightness(1.12); }
.pillbtn.warn { background: rgba(250,203,52,.14); color: var(--warn); border-color: rgba(250,203,52,.25); }
.pillbtn.danger { color: var(--bad); }
.pillbtn svg { width: 15px; height: 15px; }
.pillbtn[disabled] { opacity: .45; pointer-events: none; }
.scroll { flex: 1; overflow: auto; padding: 4px 26px 40px; min-height: 0; contain: strict; }
.view { max-width: 1320px; margin: 0 auto; }

.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 10px 0 22px; }
.hero h2 { font-size: 34px; line-height: 1.12; margin: 0; font-weight: 700; letter-spacing: -.02em; }
.hero h2 em { font-family: var(--serif); font-weight: 500; color: var(--accent2); }
.hero p { color: var(--dim); margin: 6px 0 0; font-size: 14.5px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: 1.35fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; contain: content; }
.card.flat { background: transparent; }
.card h3 { margin: 0 0 12px; font-size: 13px; font-weight: 800; color: var(--dim); display: flex; align-items: center; gap: 8px; letter-spacing: .01em; }
.card h3 .sp { flex: 1; }
.card h3 a, .linkbtn { color: var(--accent2); font-weight: 700; font-size: 12.5px; cursor: pointer; }
.empty { color: var(--faint); font-size: 13px; padding: 14px 0 4px; }
.empty b { color: var(--dim); }
.stat { display: flex; flex-direction: column; gap: 6px; }
.stat b { font-size: 30px; font-weight: 750; letter-spacing: -.02em; line-height: 1; }
.stat span { color: var(--dim); font-size: 12.5px; font-weight: 650; }
.stat small { color: var(--faint); font-size: 12px; }
.primary { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: start; background: linear-gradient(140deg, rgba(82,0,244,.34), rgba(82,0,244,.06) 55%), var(--card); border-color: rgba(139,92,255,.25); }
.primary .big { width: 84px; height: 84px; }
.primary h4 { margin: 0; font-size: 20px; font-weight: 750; }
.primary .meta { color: var(--dim); font-size: 13px; margin-top: 2px; }
.ask { display: flex; gap: 8px; margin-top: 14px; background: rgba(0,0,0,.25); border: 1px solid var(--line2); border-radius: 14px; padding: 6px; }
.ask input { background: none; border: 0; padding: 8px 8px; }
.ask input:focus { border: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.qa { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 13px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--text); font-weight: 650; font-size: 13px; }
.qa:hover { background: var(--hover); border-color: var(--line2); }
.qa svg { width: 15px; height: 15px; color: var(--accent2); }
.qa.on { background: rgba(139,92,255,.18); border-color: rgba(139,92,255,.4); }

/* avatars */
.av { position: relative; flex: none; display: block; }
.av svg { width: 100%; height: 100%; display: block; overflow: visible; }
.av .dot { position: absolute; right: -1px; bottom: -1px; width: 28%; height: 28%; min-width: 8px; min-height: 8px; border-radius: 50%; border: 2px solid var(--card); background: var(--faint); }
.av.idle .dot { background: #5d5970; } .av.working .dot, .av.thinking .dot, .av.research .dot, .av.writing .dot, .av.browsing .dot, .av.collab .dot { background: var(--ok); }
.av.approval .dot, .av.user .dot { background: var(--warn); } .av.attention .dot { background: var(--bad); } .av.paused .dot, .av.archived .dot, .av.draft .dot { background: #4a4658; } .av.queued .dot { background: var(--teal); }
.av.live svg { animation: bob 1.6s ease-in-out infinite; transform-origin: 50% 80%; }
.av.live .eyes { animation: blink 3.2s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-5%) rotate(-3deg); } 60% { transform: translateY(0) rotate(2deg); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { .av.live svg, .av.live .eyes { animation: none; } }

.status { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 11.5px; font-weight: 750; background: rgba(255,255,255,.06); color: var(--dim); white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status.ok, .status.working, .status.thinking, .status.research, .status.writing, .status.browsing, .status.collab, .status.IN_PROGRESS { color: var(--ok); background: rgba(52,211,153,.1); }
.status.approval, .status.user, .status.REQUIRES_INPUT { color: var(--warn); background: rgba(250,203,52,.1); }
.status.attention, .status.FAILED { color: var(--bad); background: rgba(255,93,108,.1); }
.status.COMPLETED { color: var(--accent2); background: rgba(139,92,255,.12); }
.status.queued, .status.QUEUED { color: var(--teal); background: rgba(45,191,205,.1); }
.status.CANCELLED, .status.paused, .status.PAUSED, .status.archived, .status.draft { color: var(--faint); }

/* lists */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 12px; cursor: pointer; min-width: 0; }
.row:hover { background: var(--hover); }
.row + .row { border-top: 1px solid var(--line); } .row:hover + .row, .row:hover { border-color: transparent; }
.row .av { width: 30px; height: 30px; }
.row .tx { flex: 1; min-width: 0; }
.row .tx b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
.row .tx small { display: block; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .when { color: var(--faint); font-size: 12px; white-space: nowrap; }
.prog { height: 4px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; margin-top: 7px; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--accent)); border-radius: 4px; transition: width .4s; }

/* bots grid */
.bots { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
.bot { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, transform .15s; position: relative; overflow: hidden; contain: content; }
.bot:hover { border-color: var(--line2); transform: translateY(-2px); }
.bot::after { content: ""; position: absolute; inset: auto -30% 70% auto; width: 160px; height: 160px; background: var(--c); opacity: .09; filter: blur(30px); border-radius: 50%; pointer-events: none; }
.bot .av { width: 58px; height: 58px; }
.bot h4 { margin: 0; font-size: 16px; font-weight: 750; } .bot .role { color: var(--dim); font-size: 12.5px; margin-top: -8px; }
.bot .cur { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px; }
.bot .nums { display: flex; gap: 14px; color: var(--faint); font-size: 12px; font-weight: 650; }
.bot .crown { position: absolute; top: 14px; right: 14px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; color: var(--accent2); text-transform: uppercase; }
.bot.add { align-items: center; justify-content: center; border-style: dashed; color: var(--dim); font-weight: 700; min-height: 200px; background: transparent; }
.bot.add svg { width: 30px; height: 30px; }

/* bot workspace */
.bhead { display: flex; align-items: center; gap: 16px; margin: 6px 0 18px; }
.bhead .av { width: 66px; height: 66px; }
.bhead h2 { margin: 0; font-size: 24px; font-weight: 750; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.bhead .sub { color: var(--dim); margin-top: 3px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.bhead .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs button { height: 38px; padding: 0 13px; color: var(--dim); font-weight: 700; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--text); } .tabs button.on { color: #fff; border-color: var(--accent); }

/* chat */
.chat { display: grid; grid-template-columns: 240px 1fr; gap: 14px; height: calc(100vh - 250px); min-height: 420px; }
.chat.wide { grid-template-columns: 1fr; }
.clist { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.clist .items { overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.citem { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; color: var(--dim); font-weight: 650; font-size: 13px; text-align: left; width: 100%; }
.citem:hover { background: var(--hover); color: var(--text); } .citem.on { background: rgba(139,92,255,.14); color: #fff; }
.citem span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.citem .pin { color: var(--accent2); font-size: 11px; }
.cpane { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); min-height: 0; overflow: hidden; }
.chead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); min-height: 52px; }
.chead b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msgs { flex: 1; overflow: auto; padding: 18px 20px 8px; display: flex; flex-direction: column; gap: 14px; user-select: text; }
.msg { display: flex; gap: 10px; max-width: 86%; position: relative; }
.msg .av { width: 28px; height: 28px; margin-top: 2px; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.bub { background: var(--card2); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; min-width: 0; overflow-wrap: anywhere; }
.msg.me .bub { background: rgba(82,0,244,.55); border-color: rgba(139,92,255,.35); }
.msg.err .bub { border-color: rgba(255,93,108,.35); color: #ffb3ba; }
.bub p { margin: 0 0 .6em; } .bub p:last-child { margin-bottom: 0; }
