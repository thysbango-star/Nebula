<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
<title>Nebula Workspace</title>
<style>
@font-face { font-family: "NB Open Sans"; src: url(fonts/OpenSans.ttf) format("truetype"); font-weight: 300 800; font-stretch: 75% 100%; }
@font-face { font-family: "NB Lora"; src: url(fonts/LoraItalic.ttf) format("truetype"); font-weight: 400 700; font-style: italic; }
@font-face { font-family: "NB Manrope"; src: url(fonts/manrope.ttf) format("truetype"); font-weight: 200 800; }

/* ---------------------------------------------------------------- tokens (light follows Windows; dark too) */
:root {
  --brand: #5200F4; --brand2: #7A3CFF;
  --bg: #F7F6F3; --side: #EFEDE8; --surface: #FFFFFF; --sunk: #F1EFEA; --hover: rgba(23,20,40,.055); --press: rgba(23,20,40,.09);
  --line: rgba(23,20,40,.08); --line2: rgba(23,20,40,.14); --text: #17151F; --dim: #6B6777; --faint: #9A96A4;
  --ok: #18A26B; --warn: #C98A06; --warnbg: #FFF6DE; --bad: #D93B4A; --badbg: #FDECEE; --info: #3B6FF0;
  --shadow: 0 1px 2px rgba(20,16,40,.05), 0 8px 24px rgba(20,16,40,.06); --pop: 0 18px 60px rgba(20,16,40,.18);
  --mebg: #ECE8FF; --metx: #1E1640;
  --ui: "NB Manrope", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; --serif: "NB Lora", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0F0E13; --side: #131218; --surface: #1A1921; --sunk: #141319; --hover: rgba(255,255,255,.05); --press: rgba(255,255,255,.09); --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.13); --text: #F3F1F8; --dim: #A39FB2; --faint: #6F6B80; --warnbg: rgba(250,203,52,.1); --badbg: rgba(255,93,108,.1); --shadow: 0 1px 2px rgba(0,0,0,.3); --pop: 0 24px 70px rgba(0,0,0,.55); --mebg: #2A2150; --metx: #EDE8FF; --ok: #34D399; --warn: #FACB34; --bad: #FF5D6C; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0F0E13; --side: #131218; --surface: #1A1921; --sunk: #141319; --hover: rgba(255,255,255,.05); --press: rgba(255,255,255,.09); --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.13); --text: #F3F1F8; --dim: #A39FB2; --faint: #6F6B80; --warnbg: rgba(250,203,52,.1); --badbg: rgba(255,93,108,.1); --shadow: 0 1px 2px rgba(0,0,0,.3); --pop: 0 24px 70px rgba(0,0,0,.55); --mebg: #2A2150; --metx: #EDE8FF; --ok: #34D399; --warn: #FACB34; --bad: #FF5D6C; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 500 14px/1.5 var(--ui); overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; }
input, textarea, select, button { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
textarea, input[type=text], input[type=password], input[type=url], input[type=number], input[type=date], input[type=time], input[type=search], input[type=datetime-local], select {
  background: var(--surface); border: 1px solid var(--line2); border-radius: 12px; padding: 9px 12px; outline: none; width: 100%; user-select: text; transition: border-color .15s, box-shadow .15s; }
textarea:focus, input:focus, select:focus { border-color: var(--brand2); box-shadow: 0 0 0 3px rgba(122,60,255,.15); }
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
::selection { background: rgba(122,60,255,.28); }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
.drag { -webkit-app-region: drag; } .nodrag, .drag button, .drag input { -webkit-app-region: no-drag; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; }

/* ---------------------------------------------------------------- onboarding: the video's flow, nicer fields and buttons */
.onb { position: fixed; inset: 0; z-index: 50; background: #5200F4; color: #fff; font-family: "NB Open Sans", "Open Sans", sans-serif; overflow: hidden; -webkit-app-region: drag; transition: opacity .42s; }
.onb::before { content: ""; position: absolute; inset: -20%; background: radial-gradient(40% 40% at 70% 20%, rgba(255,255,255,.14), transparent 70%), radial-gradient(35% 35% at 15% 85%, rgba(0,0,0,.18), transparent 70%); pointer-events: none; }
.onb.leaving { opacity: 0; }
.onb input, .onb button { -webkit-app-region: no-drag; }
.scr { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: transform .62s cubic-bezier(.65,0,.25,1), opacity .5s; will-change: transform, opacity; }
.scr.on { opacity: 1; transform: none; pointer-events: auto; }
.scr.from-h { transform: translateX(100%); opacity: 1; transition: none; } .scr.out-h { transform: translateX(-100%); opacity: 1; }
.scr.from-v { transform: translateY(100%); opacity: 1; transition: none; } .scr.out-v { transform: translateY(-100%); opacity: 1; }
.scr.from-f { transform: scale(.985); opacity: 0; transition: none; } .scr.out-f { opacity: 0; }
.mid { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-58%); text-align: center; display: flex; flex-direction: column; align-items: center; padding: 0 6vw; }
.mid.up { transform: translateY(-96%); }
.onb h1 { font-size: clamp(34px, 5.6vw, 92px); font-weight: 800; margin: 0; letter-spacing: -.015em; }
.onb h2 { font-size: clamp(28px, 4.2vw, 80px); font-weight: 800; margin: 0 0 clamp(18px, 2.4vw, 40px); letter-spacing: -.015em; line-height: 1.08; }
.scr[data-s=ready] h2 { font-size: clamp(28px, 5.2vw, 100px); margin-bottom: 2.4vw; }
.onb .sub { font-size: clamp(16px, 2.4vw, 40px); font-weight: 700; margin: .25em 0 0; opacity: .92; }
.onb .bar { width: 82vw; height: clamp(30px, 4.6vw, 80px); border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; position: relative; box-shadow: inset 0 2px 6px rgba(0,0,0,.12); }
.onb .bar i { position: absolute; inset: 0; background: #fff; border-radius: 99px; transform-origin: left; transform: scaleX(.04); }
.onb .step { display: inline-flex; gap: 6px; margin-bottom: clamp(14px, 1.6vw, 26px); }
.onb .step i { width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.35); transition: width .3s, background .3s; }
.onb .step i.on { width: 26px; background: #fff; }
.onb .field { position: relative; width: min(640px, 72vw); }
.onb .field input { width: 100%; height: clamp(58px, 5vw, 76px); border-radius: 99px; border: 0; background: rgba(255,255,255,.97); color: #1A1530; font-size: clamp(18px, 1.6vw, 24px); font-weight: 700; padding: 0 84px 0 30px; box-shadow: 0 12px 40px rgba(20,0,80,.35), inset 0 0 0 2px rgba(255,255,255,.6); caret-color: #5200F4; outline: none; transition: transform .2s, box-shadow .2s; }
.onb .field input::placeholder { color: #A9A3BF; font-weight: 600; }
.onb .field input:focus { box-shadow: 0 16px 48px rgba(20,0,80,.42), 0 0 0 5px rgba(255,255,255,.28); }
.onb .go { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: clamp(44px, 3.8vw, 58px); height: clamp(44px, 3.8vw, 58px); border-radius: 50%; background: #5200F4; color: #fff; display: grid; place-items: center; transition: transform .18s, background .18s, opacity .18s; }
.onb .go svg { width: 46%; height: 46%; }
.onb .go:hover { transform: translateY(-50%) scale(1.06); background: #3d00b8; }
.onb .go[disabled] { opacity: .3; pointer-events: none; }
.onb .hint { opacity: .7; font-size: 13.5px; font-weight: 600; margin: 16px 0 0; }
.onb .hint kbd { font: 700 12px "NB Open Sans", sans-serif; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.18); }
.onb .skip { margin-top: 10px; font-size: 13.5px; font-weight: 700; color: rgba(255,255,255,.75); text-decoration: underline; text-underline-offset: 3px; }
.onb .choices { display: flex; gap: clamp(14px, 1.6vw, 24px); justify-content: center; flex-wrap: wrap; }
.onb .choice { min-width: clamp(190px, 16vw, 260px); padding: 22px 26px; border-radius: 26px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); color: #fff; font-size: clamp(16px, 1.3vw, 21px); font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: transform .18s, background .18s, border-color .18s; }
.onb .choice:hover { transform: translateY(-3px); background: rgba(255,255,255,.2); border-color: #fff; }
.onb .choice svg { width: 52px; height: 52px; }
.onb .choice small { font-size: 12.5px; font-weight: 600; opacity: .75; }
.onb .numfield { display: none; }
.onb .numfield.on { display: block; margin-top: 22px; }
.onb .cta { margin-top: clamp(10px, 1.2vw, 22px); height: clamp(56px, 4.6vw, 70px); padding: 0 clamp(30px, 2.6vw, 44px); border-radius: 99px; background: #fff; color: #3a00b0; font-size: clamp(17px, 1.4vw, 22px); font-weight: 800; display: inline-flex; align-items: center; gap: 14px; box-shadow: 0 14px 44px rgba(20,0,80,.4); transition: transform .18s, box-shadow .18s; }
.onb .cta:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 18px 56px rgba(20,0,80,.5); }
.onb .cta svg { width: 22px; height: 22px; }
.onb .back { position: absolute; left: 26px; top: 22px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); color: #fff; z-index: 3; transition: background .15s; }
.onb .back:hover { background: rgba(255,255,255,.26); }
.onb .back svg { width: 20px; height: 20px; }
.ring { width: clamp(70px, 6.4vw, 110px); height: clamp(70px, 6.4vw, 110px); border-radius: 50%; border: 5px solid rgba(255,255,255,.22); border-top-color: #fff; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.mascot { position: absolute; left: 0; bottom: 0; width: 17.5vw; transform: translate(-3%, 14%); }
.mascot svg { display: block; width: 100%; height: auto; }
.pilewrap { position: absolute; left: 50%; bottom: 0; width: 38vw; transform: translate(-50%, 22%); }
.pilewrap svg { width: 100%; height: auto; display: block; }
.peek { position: absolute; right: 6vw; bottom: 0; width: clamp(110px, 11vw, 190px); transform: translateY(38%); transition: transform .5s cubic-bezier(.3,1.5,.5,1); }
.peek.hop { animation: peekhop .55s cubic-bezier(.3,1.6,.5,1); }
@keyframes peekhop { 40% { transform: translateY(18%) scaleY(1.04); } }
.peek svg { width: 100%; height: auto; display: block; overflow: visible; }
.peek .ey { transition: transform .25s ease-out; }

/* ---------------------------------------------------------------- intro animation */
.intro { position: fixed; inset: 0; z-index: 60; background: #5200F4; transition: opacity .6s; }
.intro.leaving { opacity: 0; }
.intro canvas { position: absolute; inset: 0; display: block; }
.intro .skipb { position: absolute; right: 22px; bottom: 20px; color: rgba(255,255,255,.75); font: 700 13px "NB Open Sans", sans-serif; padding: 9px 16px; border-radius: 99px; background: rgba(255,255,255,.12); }
.intro .skipb:hover { background: rgba(255,255,255,.22); color: #fff; }
.intro .skipb.mute { right: auto; left: 22px; }

/* ---------------------------------------------------------------- the app: roster | chat | details */
.app { display: grid; grid-template-columns: 284px 1fr; height: 100vh; }
.app.panel { grid-template-columns: 284px 1fr 360px; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
.sidetop { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; flex: none; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--brand); display: grid; place-items: center; overflow: hidden; flex: none; }
.mark svg { width: 21px; height: auto; transform: translate(1px, 3px); }
.sidetop b { font-size: 15px; letter-spacing: -.01em; flex: 1; }
.ib { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--dim); flex: none; transition: background .12s, color .12s; }
.ib:hover { background: var(--hover); color: var(--text); } .ib:active { background: var(--press); }
.ib.on { color: var(--brand2); }
.search { margin: 2px 12px 8px; position: relative; }
.search input { height: 36px; padding-left: 34px; background: var(--surface); border-color: var(--line); border-radius: 10px; font-size: 13.5px; }
.search svg { position: absolute; left: 10px; top: 9px; width: 18px; height: 18px; color: var(--faint); }
.search kbd { position: absolute; right: 8px; top: 8px; font: 700 11px var(--ui); color: var(--faint); background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.roster { flex: 1; overflow: auto; padding: 0 8px 8px; contain: strict; }
.rlbl { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 12px 10px 4px; }
.rrow { display: grid; grid-template-columns: 44px 1fr auto; gap: 0 10px; align-items: center; width: 100%; padding: 8px 10px; border-radius: 12px; text-align: left; position: relative; }
.rrow:hover { background: var(--hover); }
.rrow.on { background: var(--surface); box-shadow: var(--shadow); }
.rrow .nm { font-weight: 750; font-size: 14px; display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow .nm .star { color: var(--brand2); font-size: 11px; }
.rrow .ln { grid-column: 2; font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rrow .ln.act { color: var(--brand2); } .rrow .ln.need { color: var(--warn); font-weight: 700; } .rrow .ln.bad { color: var(--bad); font-weight: 700; }
.rrow .tm { font-size: 11.5px; color: var(--faint); align-self: start; padding-top: 2px; }
.rrow .badge { grid-column: 3; grid-row: 2; justify-self: end; min-width: 18px; height: 18px; border-radius: 9px; background: var(--brand2); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 5px; }
.rrow .av { grid-row: span 2; }
.sidefoot { padding: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.srow { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 10px; color: var(--dim); font-weight: 650; font-size: 13.5px; width: 100%; text-align: left; }
.srow:hover { background: var(--hover); color: var(--text); }
.srow .who { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), #FD715F); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; flex: none; }
.srow .ct { margin-left: auto; font-size: 11px; font-weight: 800; color: var(--faint); }

/* ---------------------------------------------------------------- avatars: the shape is the identity, the motion is the status */
.av { position: relative; display: inline-block; flex: none; width: var(--s, 36px); height: var(--s, 36px); }
.av svg { width: 100%; height: 100%; display: block; overflow: visible; }
.av svg { transform-origin: 50% 88%; will-change: auto; }
.av .ey { transform-box: view-box; transform-origin: 50% 50%; transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
.av .e { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .25s ease-out; }
.av .dots { opacity: 0; transition: opacity .2s; }
.av .pip { position: absolute; right: 2%; top: 0; width: clamp(9px, 26%, 15px); height: clamp(9px, 26%, 15px); border-radius: 50%; border: 2px solid var(--side); background: var(--warn); opacity: 0; transform: scale(.4); transition: opacity .2s, transform .3s cubic-bezier(.3,1.6,.5,1); }
.av .pip::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; background: var(--warn); opacity: 0; }
.rrow.on .av .pip { border-color: var(--surface); }
/* Body motion runs on the <svg> box (composited: no repaint); eye motion is short transitions driven from the
   script (a blink or a glance now and then), so an idle roster costs nothing between them. */
/* idle: the script adds .bl (blink) and .lk-l / .lk-r (glance) for a moment */
.av.bl .e { transform: scaleY(.08); transition-duration: .07s; }
.av.lk-l .ey { transform: translate(-5px, 1px); } .av.lk-r .ey { transform: translate(5px, -1px); }
/* thinking: eyes up to the side, dots */
.av.think .ey { transform: translate(5px, -6px); }
.av.think .dots { opacity: 1; }
.av.think .dots circle { animation: dot 1.2s infinite; } .av.think .dots circle:nth-child(2) { animation-delay: .2s; } .av.think .dots circle:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
/* working: focused eyes, busy bounce */
.av.work svg { animation: busy .82s ease-in-out infinite var(--d, 0s); }
.av.work .ey { transform: translate(0, 2px); }
.av.work .e { transform: scaleY(.62); }
@keyframes busy { 0%, 100% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(-4%) scale(.98, 1.03); } 70% { transform: translateY(0) scale(1.03, .97); } }
/* needs you: looks up at you, leans in, hops; the pip pings */
.av.need svg { animation: needhop 2.4s cubic-bezier(.3,1.4,.5,1) infinite var(--d, 0s); }
.av.need .ey { transform: translate(0, -7px) scale(1.14); }
.av.need .pip { opacity: 1; transform: scale(1); }
.av.need .pip::after { animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite; }
@keyframes needhop { 0%, 55%, 100% { transform: translateY(0) scale(1, 1); } 64% { transform: translateY(2%) scale(1.06, .94); } 74% { transform: translateY(-12%) scale(.96, 1.05); } 86% { transform: translateY(0) scale(1.04, .96); } }
@keyframes ping { 0% { transform: scale(.5); opacity: .5; } 80%, 100% { transform: scale(1.4); opacity: 0; } }
/* done: happy squint and one little jump */
.av.done .e { transform: scaleY(.28) translateY(-12%); }
.av.done svg { animation: yay .7s cubic-bezier(.3,1.6,.5,1) 1; }
@keyframes yay { 40% { transform: translateY(-10%) scale(.97, 1.04); } }
/* trouble: eyes down, a small shake, red pip */
.av.fail .ey { transform: translate(0, 5px) scale(.92); }
.av.fail svg { animation: shake .5s 1; }
.av.fail .pip { opacity: 1; transform: scale(1); background: var(--bad); }
@keyframes shake { 20%, 60% { transform: rotate(-4deg); } 40%, 80% { transform: rotate(4deg); } }
/* paused / asleep: eyes closed, dimmed */
.av.sleep .e { transform: scaleY(.1); }
.av.sleep svg { opacity: .55; }
.av.queue .ey { transform: translate(-4px, 0); }
.lite .av *, .lite .av { animation: none !important; }
@media (prefers-reduced-motion: reduce) { .av *, .av { animation: none !important; } }

/* ---------------------------------------------------------------- chat */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.chead { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 150px 0 18px; border-bottom: 1px solid var(--line); flex: none; }
.chead .who { display: flex; align-items: center; gap: 10px; min-width: 0; border-radius: 10px; padding: 4px 8px 4px 4px; }
.chead .who:hover { background: var(--hover); }
.chead .who b { font-size: 15px; white-space: nowrap; }
.chead .sp { flex: 1; }
.comp-ic.live { color: var(--brand2); }
.comp-ic.live svg { animation: blinkc 1.4s infinite; } @keyframes blinkc { 50% { opacity: .45; } }
.tx { flex: 1; overflow: auto; min-height: 0; }
.col { max-width: 780px; margin: 0 auto; padding: 22px 28px 12px; display: flex; flex-direction: column; gap: 6px; user-select: text; }
.m { display: flex; gap: 12px; padding: 6px 0; position: relative; }
.m .av { margin-top: 2px; }
.m .body { min-width: 0; flex: 1; }
.m .meta { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--faint); margin-bottom: 2px; }
.m .meta b { color: var(--text); font-size: 13.5px; }
.m.me { justify-content: flex-end; }
.m.me .body { flex: 0 1 auto; max-width: 78%; }
.m.me .bub { background: var(--mebg); color: var(--metx); border-radius: 18px 18px 4px 18px; padding: 9px 14px; }
.m.me .meta { justify-content: flex-end; }
.m.grp { padding-top: 0; }
.m.grp .meta { display: none; }
.m.grp > .av { visibility: hidden; height: 0; }
.md p { margin: 0 0 .65em; } .md p:last-child { margin-bottom: 0; }
.md h2, .md h3, .md h4 { margin: .8em 0 .35em; font-size: 15px; } .md h2:first-child, .md h3:first-child { margin-top: 0; }
.md ul, .md ol { margin: .2em 0 .65em; padding-left: 1.3em; } .md li { margin: .15em 0; }
.md code { background: var(--sunk); border: 1px solid var(--line); padding: 0 5px; border-radius: 5px; font: 12.5px ui-monospace, Consolas, monospace; }
.md pre { background: var(--sunk); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; overflow: auto; } .md pre code { background: none; border: 0; padding: 0; }
.md table { border-collapse: collapse; margin: .5em 0; font-size: 13px; display: block; overflow: auto; } .md th, .md td { border: 1px solid var(--line2); padding: 6px 10px; text-align: left; } .md th { background: var(--sunk); }
.md a { color: var(--brand2); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.md .quote { border-left: 3px solid var(--brand2); padding: 3px 10px; margin: 0 0 8px; color: var(--dim); font-size: 13px; cursor: pointer; }
.md details { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin: 6px 0; background: var(--surface); } .md summary { cursor: pointer; font-weight: 700; font-size: 13px; }
.long { max-height: 380px; overflow: hidden; -webkit-mask: linear-gradient(#000 70%, transparent); }
.more { color: var(--brand2); font-weight: 750; font-size: 12.5px; margin-top: 4px; }

.fcard:hover { border-color: var(--line2); }
.fcard i { font-style: normal; font-size: 10px; font-weight: 800; padding: 4px 6px; border-radius: 6px; background: var(--brand); color: #fff; text-transform: uppercase; }
.ev { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12.5px; padding: 4px 0 4px 48px; }

.ev .dot svg { width: 13px; height: 13px; }
.ev b { color: var(--text); font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.tcard { margin: 6px 0 6px 48px; padding: 12px 14px; cursor: pointer; }
.tcard:hover { border-color: var(--line2); }
.tcard .hd { display: flex; align-items: center; gap: 8px; }

.tcard .prog { height: 3px; border-radius: 3px; background: var(--sunk); margin-top: 10px; overflow: hidden; } .tcard .prog i { display: block; height: 100%; background: var(--brand2); border-radius: 3px; transition: width .4s; }

.pill.run { background: rgba(122,60,255,.12); color: var(--brand2); } .pill.ok { background: rgba(24,162,107,.12); color: var(--ok); } .pill.need { background: var(--warnbg); color: var(--warn); } .pill.bad { background: var(--badbg); color: var(--bad); }

.ask pre { margin: 0; white-space: pre-wrap; font: 12px ui-monospace, Consolas, monospace; background: var(--sunk); border-radius: 8px; padding: 8px; max-height: 140px; overflow: auto; }

.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { height: 34px; padding: 0 14px; border-radius: 10px; font-weight: 750; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--line2); white-space: nowrap; transition: background .12s, transform .08s; }
.btn:hover { background: var(--hover); } .btn:active { transform: scale(.98); }

/* ---------------------------------------------------------------- create screen (3 seconds) */

.create .colors button:hover { transform: scale(1.15); }
.create .colors button.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }
.create .shapes { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; }
.create .shapes button { width: 44px; height: 44px; border-radius: 12px; padding: 6px; transition: background .12s; }
.create .shapes button:hover { background: var(--hover); } .create .shapes button.on { background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1.5px var(--line2); }
.create .nm { width: 300px; text-align: center; font-size: 16px; font-weight: 700; height: 46px; border-radius: 14px; }

.tpls button { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); transition: border-color .15s, transform .15s, box-shadow .15s; }

.tpls b { display: block; font-size: 13.5px; } .tpls small { color: var(--dim); font-size: 12px; line-height: 1.35; display: block; }

/* ---------------------------------------------------------------- details panel */
.panel-side { border-left: 1px solid var(--line); background: var(--side); display: flex; flex-direction: column; min-height: 0; }
.ptabs { height: 52px; display: flex; align-items: flex-end; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); flex: none; }
.ptabs button { height: 40px; padding: 0 12px; font-weight: 750; font-size: 13px; color: var(--dim); border-bottom: 2px solid transparent; }
.ptabs button.on { color: var(--text); border-color: var(--text); }
.ptabs .sp { flex: 1; }
.pbody { flex: 1; overflow: auto; padding: 18px; }
.prof { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 6px 0 14px; }
.prof .nmi { font-size: 18px; font-weight: 800; border: 0; background: none; text-align: center; padding: 4px 8px; border-radius: 8px; width: auto; max-width: 100%; }

.prof .role { color: var(--dim); font-size: 13px; }
.sec { margin-top: 18px; }

.kvl { display: flex; flex-direction: column; gap: 2px; }
.kvr { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.kvr + .kvr { margin-top: 4px; }
.kvr .t { flex: 1; min-width: 0; } .kvr .t b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .kvr .t small { display: block; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kvr.click { cursor: pointer; } .kvr.click:hover { border-color: var(--line2); }
.jobtxt { font-size: 13px; color: var(--text); white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.jobtxt .k { color: var(--faint); font-weight: 750; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; display: block; margin-top: 6px; } .jobtxt .k:first-child { margin-top: 0; }
.sw { width: 34px; height: 20px; border-radius: 10px; background: var(--line2); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .18s cubic-bezier(.3,1.4,.5,1); }
.sw.on { background: var(--ok); } .sw.on::after { transform: translateX(14px); }
.empty { color: var(--faint); font-size: 12.5px; padding: 8px 2px; }
.helpl { color: var(--faint); font-size: 12px; }
.risk { font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; }
.risk.low { background: rgba(24,162,107,.12); color: var(--ok); } .risk.medium { background: var(--warnbg); color: var(--warn); } .risk.high { background: var(--badbg); color: var(--bad); }

/* ---------------------------------------------------------------- overlays */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(10,8,20,.38); display: grid; place-items: center; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(720px, calc(100vw - 40px)); max-height: calc(100vh - 60px); display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line2); border-radius: 22px; box-shadow: var(--pop); animation: pop .2s cubic-bezier(.2,.9,.3,1.1); overflow: hidden; }
.modal.xl { width: min(1000px, calc(100vw - 40px)); height: min(760px, calc(100vh - 60px)); }
@keyframes pop { from { transform: translateY(8px) scale(.985); opacity: 0; } }
.mhead { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); } .mhead b { flex: 1; font-size: 15.5px; }
.mbody { padding: 18px; overflow: auto; flex: 1; }
.mfoot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); align-items: center; } .mfoot .sp { flex: 1; }
.stabs { display: grid; grid-template-columns: 190px 1fr; flex: 1; min-height: 0; }
.stabs nav { border-right: 1px solid var(--line); padding: 12px 8px; background: var(--side); overflow: auto; }
.stabs nav button { display: flex; width: 100%; height: 34px; align-items: center; gap: 9px; padding: 0 10px; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--dim); }
.stabs nav button:hover { background: var(--hover); color: var(--text); } .stabs nav button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.stabs .mbody { padding: 20px 22px; }
.field { margin-bottom: 14px; } .field > label { display: block; font-size: 12px; font-weight: 800; color: var(--dim); margin-bottom: 6px; } .field .help { color: var(--faint); font-size: 12px; margin-top: 5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.seg { display: inline-flex; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { height: 28px; padding: 0 11px; border-radius: 8px; color: var(--dim); font-weight: 750; font-size: 12.5px; } .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 11px 13px; border: 1px solid var(--line); border-radius: 13px; cursor: pointer; margin-bottom: 7px; background: var(--surface); }
.opt:hover { border-color: var(--line2); } .opt.on { border-color: var(--brand2); box-shadow: 0 0 0 3px rgba(122,60,255,.1); }
.opt b { display: block; font-size: 13.5px; } .opt small { color: var(--dim); font-size: 12.5px; }
.opt .box { width: 18px; height: 18px; border-radius: 6px; border: 2px solid var(--line2); flex: none; margin-top: 1px; display: grid; place-items: center; }
.opt.on .box { background: var(--brand2); border-color: var(--brand2); } .opt.on .box::after { content: ""; width: 8px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.note { padding: 11px 13px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); color: var(--dim); font-size: 12.5px; margin-bottom: 12px; } .note.warn { background: var(--warnbg); color: var(--warn); border-color: transparent; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 92vw); z-index: 31; background: var(--bg); border-left: 1px solid var(--line2); display: flex; flex-direction: column; animation: slide .2s cubic-bezier(.2,.9,.3,1); box-shadow: var(--pop); }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.steps { list-style: none; padding: 0; margin: 0; } .steps li { display: flex; gap: 10px; font-size: 13px; padding: 5px 0; } .steps li i { width: 18px; height: 18px; border-radius: 50%; flex: none; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 900; }
.steps li.DONE i { background: rgba(24,162,107,.14); color: var(--ok); } .steps li.FAILED i, .steps li.DENIED i { background: var(--badbg); color: var(--bad); } .steps li.WAITING i { background: var(--warnbg); color: var(--warn); } .steps li.PLAN i { border: 1.5px solid var(--line2); }
.steps li small { display: block; color: var(--faint); font-size: 12px; }
.menu { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--line2); border-radius: 12px; padding: 5px; min-width: 200px; box-shadow: var(--pop); animation: pop .12s; }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; font-weight: 650; font-size: 13px; text-align: left; }
.menu button:hover { background: var(--hover); } .menu button.danger { color: var(--bad); } .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.palette { width: min(640px, calc(100vw - 40px)); background: var(--bg); border: 1px solid var(--line2); border-radius: 18px; box-shadow: var(--pop); overflow: hidden; animation: pop .15s; align-self: start; margin-top: 12vh; }
.palette input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; height: 52px; font-size: 16px; padding: 0 18px; box-shadow: none !important; background: var(--bg); }
.palette .res { max-height: 50vh; overflow: auto; padding: 6px; }
.palette .it { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 10px; text-align: left; font-size: 13.5px; }
.palette .it.on, .palette .it:hover { background: var(--hover); } .palette .it small { color: var(--faint); margin-left: auto; font-size: 12px; }
.palette .grp { font-size: 11px; font-weight: 800; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; padding: 8px 10px 4px; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 70; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; box-shadow: var(--pop); animation: pop .2s; max-width: 70vw; font-size: 13.5px; }
.toast.bad { background: var(--bad); color: #fff; }
.tl .evr { display: grid; grid-template-columns: 52px 26px 1fr; gap: 10px; padding: 6px 4px; font-size: 13px; border-radius: 8px; } .tl .evr.link { cursor: pointer; } .tl .evr.link:hover { background: var(--hover); }
.tl .evr time { color: var(--faint); font-size: 12px; text-align: right; padding-top: 3px; } .tl .k { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-right: 6px; }
.tl .day { font-size: 11px; font-weight: 800; color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin: 12px 4px 4px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; } table.t th { text-align: left; color: var(--faint); font-weight: 750; font-size: 12px; padding: 7px 8px; border-bottom: 1px solid var(--line); } table.t td { padding: 8px; border-bottom: 1px solid var(--line); }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 14px; } .stat b { font-size: 26px; letter-spacing: -.02em; } .stat span { color: var(--dim); font-size: 12px; font-weight: 700; }

/* ---------------------------------------------------------------- pieces the app script uses */
.avh { display: contents; }
.chead .who .wt { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; text-align: left; }
.chead .who .sub { color: var(--faint); font-size: 12px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m .avsp { width: 32px; flex: none; }
.m .md.err { color: var(--bad); }
.m .quote { border-left: 3px solid var(--brand2); padding: 2px 10px; margin: 0 0 6px; color: var(--dim); font-size: 12.5px; cursor: pointer; }
.m.me .quote { text-align: right; border-left: 0; border-right: 3px solid var(--brand2); }
.ev .tm { margin-left: auto; color: var(--faint); font-size: 11.5px; }
.tcard .hd > svg { width: 15px; height: 15px; color: var(--brand2); }
.tcard .helpl { margin-top: 6px; } .tcard .helpl.act { color: var(--brand2); } .tcard .helpl.bad { color: var(--bad); }
.ask .row2 .sp { flex: 1; }
.ask .row2 input { flex: 1; min-width: 160px; height: 36px; }
.ask.q { border-color: rgba(122,60,255,.32); }
.ask.sent { opacity: .55; pointer-events: none; transition: opacity .2s; }
/* lettered answer buttons: big, calm, keyboard-friendly */
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin: 4px 0 10px; }
.optb { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border-radius: 13px; background: var(--bg); border: 1px solid var(--line2); text-align: left; font-weight: 650; font-size: 13.5px; transition: border-color .15s, background .15s, transform .1s; }
.optb:hover { border-color: var(--brand2); background: var(--surface); }
.optb:active { transform: scale(.985); }
.optb kbd { width: 24px; height: 24px; border-radius: 8px; flex: none; display: grid; place-items: center; font: 800 11.5px var(--ui); background: var(--sunk); color: var(--dim); border: 1px solid var(--line); transition: background .15s, color .15s; }
.optb:hover kbd { background: var(--brand2); color: #fff; border-color: transparent; }
.working .avh .av { --s: 28px; }
.hero .av { --s: 96px; }
