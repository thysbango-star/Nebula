<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vibrance</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Vibrance for Windows: a flowing ribbon of light around every screen edge plus an aurora
// rising from the bottom. Breathes with your voice, races while thinking, pulses while speaking.
const SCALE = 0.5; // the glow is soft, so half resolution looks identical and saves GPU
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });

const VERT = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
const FRAG = `
precision highp float;
uniform vec2 uRes;
uniform float uTime, uLevel, uReveal, uIntensity, uThink, uSpeak, uAlert, uCalm, uPulse, uRadius, uScale;

const float PI = 3.14159265;

vec3 flow(float t) {
  // Cyclic palette: sky blue → indigo → violet → rose → ember → lime → back.
  vec3 c = 0.5 + 0.5 * cos(6.28318 * (vec3(1.0) * t + vec3(0.62, 0.43, 0.18)));
  return pow(c, vec3(1.6)) * 1.25; // richer, more saturated colour
}
vec3 alertPal(float t) {
  return mix(vec3(1.0, 0.45, 0.22), vec3(1.0, 0.75, 0.30), 0.5 + 0.5 * sin(6.28318 * t));
}
vec3 pal(float t) { return mix(flow(t), alertPal(t), uAlert); }

float sdRoundBox(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

void main() {
  vec2 p = gl_FragCoord.xy;
  vec2 c = uRes * 0.5;
  float d = max(0.0, -sdRoundBox(p - c, c, uRadius)) / uScale; // distance in from the edge, screen px

  // Where we are around the screen: 0 at bottom centre, 1 at top centre.
  vec2 n = (p - c) / uRes;
  float ang = atan(n.y, n.x);
  float u = abs(mod(ang + PI * 0.5 + PI, 2.0 * PI) - PI) / PI;

  float t = uTime;
  float pulse = 1.0 + uSpeak * 0.35 * sin(t * 7.5) + uPulse * 0.8;
  float energy = clamp(uLevel * 1.1 + uThink * 0.3, 0.0, 1.4);

  // Trace in from the bottom centre, up both sides, meeting at the top.
  float reveal = smoothstep(uReveal + 0.06, uReveal - 0.06, u);

  // ---- edge ribbon
  float w = 1.0 + 0.9 * energy;
  float core = exp(-d / (2.5 * w)) * 0.95;
  float bloom = exp(-d / (14.0 * w)) * 0.55;
  float haze = exp(-d / (38.0 + 70.0 * energy)) * 0.16;
  float edge = (core + bloom + haze) * reveal * pulse;
  vec3 edgeCol = pal(ang / 6.28318 + t * 0.045);
  edgeCol = mix(edgeCol, vec3(1.0), core * 0.2);

  // Thinking: two bright comets racing around the edge.
  if (uThink > 0.0) {
    for (int k = 0; k < 2; k++) {
      float head = fract(t * 0.22 + float(k) * 0.5) * 2.0 * PI - PI;
      float da = mod(ang - head + PI, 2.0 * PI) - PI;
      float tail = exp(-max(da, 0.0) * 9.0) * step(-0.02, da) + exp(-abs(da) * 60.0);
      edge += uThink * tail * exp(-d / 10.0) * 1.3 * reveal;
    }
  }

  // ---- bottom aurora: a softly rolling wave of colour that rises with your voice
  float x = p.x / uRes.x;
  float y = p.y / uRes.y;
  float h = (0.085 + 0.045 * sin(x * 5.0 + t * 0.6) + 0.03 * sin(x * 11.0 - t * 1.05) + 0.015 * sin(x * 23.0 + t * 1.7));
  h *= (0.55 + 1.1 * energy) * pulse * uReveal;
  float centre = 0.55 + 0.45 * pow(1.0 - abs(x - 0.5) * 2.0, 0.6);
  float crest = exp(-abs(y - h) / 0.012) * 0.75;
  float above = (y > h) ? exp(-(y - h) / (0.05 + 0.08 * energy)) * 0.45 : 0.0;
  float below = (y <= h) ? 0.10 + 0.22 * pow(y / max(h, 0.001), 2.0) : 0.0;
  float aurora = (crest + above + below) * centre * smoothstep(0.0, 0.25, uReveal);
  vec3 auroraCol = pal(x * 0.85 + t * 0.03 + 0.15);
  auroraCol = mix(auroraCol, vec3(1.0), crest * 0.15);

  vec3 col = edgeCol * edge + auroraCol * aurora;
  col *= uIntensity * uCalm;
  float a = clamp(max(max(col.r, col.g), col.b), 0.0, 1.0);
  gl_FragColor = vec4(min(col, vec3(1.0)), a);
}`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = {};
['uRes', 'uTime', 'uLevel', 'uReveal', 'uIntensity', 'uThink', 'uSpeak', 'uAlert', 'uCalm', 'uPulse', 'uRadius', 'uScale']
  .forEach((k) => { U[k] = gl.getUniformLocation(prog, k); });

// ---------------------------------------------------------------- state
const S = {
  active: false, phase: 'idle', intensity: 0.75,
  level: 0, levelTarget: 0, reveal: 0, think: 0, speak: 0, alert: 0, calm: 1, pulse: 0,
  t: 0, last: 0, running: false,
};
const ease = (cur, target, k, dt) => cur + (target - cur) * (1 - Math.exp(-k * dt));

function resize() {
  canvas.width = Math.max(2, Math.round(innerWidth * devicePixelRatio * SCALE));
  canvas.height = Math.max(2, Math.round(innerHeight * devicePixelRatio * SCALE));
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

function frame(now) {
  const dt = S.last ? Math.min(0.05, (now - S.last) / 1000) : 0.016;
  S.last = now;
  const speed = { thinking: 2.6, speaking: 1.5, listening: 1, done: 0.6, error: 0.5 }[S.phase] || 1;
  if (!S.frozen) S.t += dt * speed;
  if (!S.frozen) S.level = ease(S.level, S.phase === 'listening' ? S.levelTarget : 0, 10, dt);
  if (!S.frozen) S.reveal = ease(S.reveal, S.active || S.pulse > 0.01 ? 1.08 : 0, S.active ? 2.6 : 4.5, dt);
  S.think = ease(S.think, S.phase === 'thinking' ? 1 : 0, 4, dt);
  S.speak = ease(S.speak, S.phase === 'speaking' ? 1 : 0, 4, dt);
  S.alert = ease(S.alert, S.phase === 'error' ? 1 : 0, 4, dt);
  S.calm = ease(S.calm, S.phase === 'done' ? 0.6 : 1, 2, dt);
  S.pulse = ease(S.pulse, 0, 1.4, dt);

  const dpr = devicePixelRatio * SCALE;
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uTime, S.t);
  gl.uniform1f(U.uLevel, S.level);
  gl.uniform1f(U.uReveal, S.reveal);
  gl.uniform1f(U.uIntensity, 0.45 + 0.75 * S.intensity);
  gl.uniform1f(U.uThink, S.think);
  gl.uniform1f(U.uSpeak, S.speak);
  gl.uniform1f(U.uAlert, S.alert);
  gl.uniform1f(U.uCalm, S.calm);
  gl.uniform1f(U.uPulse, S.pulse);
  gl.uniform1f(U.uRadius, 10 * dpr);
  gl.uniform1f(U.uScale, dpr);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // Stop drawing once fully faded out (saves the GPU when idle).
  if (!S.active && S.reveal < 0.003 && S.pulse < 0.01) {
    gl.clear(gl.COLOR_BUFFER_BIT);
    S.running = false;
    S.last = 0;
    return;
  }
  requestAnimationFrame(frame);
}
function wake() { if (!S.running) { S.running = true; requestAnimationFrame(frame); } }

// ---------------------------------------------------------------- wiring
const api = window.nebula;
if (api) {
  api.on('vibrance:state', (s) => { Object.assign(S, { active: s.active, phase: s.phase, intensity: s.intensity ?? S.intensity }); wake(); });
  api.on('vibrance:level', (l) => { S.levelTarget = l; });
  api.on('vibrance:pulse', () => { S.pulse = 1; S.phase = 'done'; wake(); });
}

// Preview hooks for testing: glow.html?demo=thinking&t=3&level=0.5
const q = new URLSearchParams(location.search);
if (q.has('demo')) {
  Object.assign(S, { active: true, phase: q.get('demo'), levelTarget: +(q.get('level') || 0.3) });
  if (q.has('static')) {
    S.reveal = +(q.get('reveal') || 1.08); S.t = +(q.get('t') || 2); S.level = S.levelTarget;
    S.think = S.phase === 'thinking' ? 1 : 0; S.speak = S.phase === 'speaking' ? 1 : 0; S.alert = S.phase === 'error' ? 1 : 0;
    S.frozen = true;
  }
  wake();
}
</script>
</body>
</html>
