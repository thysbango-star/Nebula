<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nebula island</title>
<style>
  @property --spin { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  :root {
    --text: #F4F1FF; --dim: rgba(244,241,255,.66); --faint: rgba(244,241,255,.40);
    --violet: #9B6CFF; --rose: #FF4F9A; --sky: #3FC8FF; --mint: #5CF2B0; --amber: #FFC266;
    --spring: cubic-bezier(.32, 1.42, .56, 1);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text);
    -webkit-font-smoothing: antialiased; user-select: none; }

  /* The island hangs from the top edge: flat top, rounded bottom, like a notch. */
  #island {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 210px; height: 34px; border-radius: 0 0 18px 18px;
    background: #000; overflow: hidden;
    transition: width .62s var(--spring), height .62s var(--spring), border-radius .5s var(--ease), opacity .3s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  #island.hidden { width: 120px; height: 0; opacity: 0; }
  #island.hover { width: 640px; height: 150px; border-radius: 0 0 30px 30px; }
  #island.session { width: 600px; border-radius: 0 0 32px 32px; }
  /* R3cket: a slim bar over games */
  #island.game { width: 540px; height: 40px; border-radius: 0 0 20px 20px; }
  #game { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px 0 10px; }
  #game .line { flex: 1; font: 500 13.5px/1 "Segoe UI", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #game .tag { font: 700 10px/1 "Segoe UI", sans-serif; letter-spacing: 1.2px; color: var(--amber); }
  .clickchip { display: none; align-items: center; gap: 5px; margin-left: 10px; font: 600 12px/1 "Segoe UI", sans-serif; color: var(--mint); cursor: pointer; }
  .clickchip.on { display: flex; }
  #island.clicking:not(.hover):not(.session):not(.game) { width: 270px; }

  /* Flowing Vibrance rim while Nebula is awake. */
  #rim { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
    transition: opacity .5s ease; padding: 1.4px;
    background: conic-gradient(from var(--spin), #3FC8FF, #5B6CFF, #B45CFF, #FF4F9A, #FF8A3D, #9BE15D, #3FC8FF);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 6s linear infinite; }
  #island.awake #rim { opacity: .9; }
  #island.thinking #rim { animation-duration: 1.6s; }
  @keyframes spin { to { --spin: 360deg; } }
  #glowShadow { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 600px; height: 40px;
    pointer-events: none; opacity: 0; transition: opacity .6s ease, width .62s var(--spring); filter: blur(28px);
    background: conic-gradient(from var(--spin), #3FC8FF, #B45CFF, #FF4F9A, #FF8A3D, #3FC8FF); animation: spin 6s linear infinite; }
  #glowShadow.on { opacity: .55; }

  /* Content morph: old view blurs out fast, new one un-blurs in once the shape is on its way (like the references). */
  .view { position: absolute; inset: 0; opacity: 0; pointer-events: none; filter: blur(8px); transform: scale(.97); transform-origin: 50% 0;
    transition: opacity .14s ease, filter .14s ease, transform .2s ease; }
  .view.on { opacity: 1; pointer-events: auto; filter: none; transform: none;
    transition: opacity .32s ease .14s, filter .38s ease .12s, transform .5s var(--spring) .1s; }

  /* Curved shoulders that join the island to the top edge of the screen (moves in step with the island). */
  .shoulder { position: absolute; top: 0; width: 16px; height: 16px; pointer-events: none; opacity: 1;
    transition: left .62s var(--spring), opacity .3s ease; }
  #shL { left: calc(50% - 105px - 16px); background: radial-gradient(circle at 0 100%, transparent 15.5px, #000 16px); }
  #shR { left: calc(50% + 105px); background: radial-gradient(circle at 100% 100%, transparent 15.5px, #000 16px); }
  body.m-hidden .shoulder { opacity: 0; }
  body.m-hover #shL { left: calc(50% - 320px - 16px); } body.m-hover #shR { left: calc(50% + 320px); }
  body.m-session #shL { left: calc(50% - 300px - 16px); } body.m-session #shR { left: calc(50% + 300px); }
  body.m-game #shL, body.m-hud #shL { left: calc(50% - 270px - 16px); } body.m-game #shR, body.m-hud #shR { left: calc(50% + 270px); }
  body.m-clicking #shL { left: calc(50% - 135px - 16px); } body.m-clicking #shR { left: calc(50% + 135px); }

  /* R3cket HUD while you play */
  #island.hud { width: 540px; height: 34px; }
  #hud { display: flex; align-items: center; gap: 14px; height: 34px; padding: 0 14px; font: 600 12.5px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; }
  #hud .tag { color: #B8FF3D; letter-spacing: 1.2px; font-size: 10.5px; font-weight: 700; }
  #hud .k { color: var(--faint); font-size: 10px; letter-spacing: .8px; margin-right: 4px; font-weight: 700; }
  #hud .sp { flex: 1; }
  #hud .x { cursor: pointer; color: #B8FF3D; }
  .shared { display: none; align-items: center; gap: 5px; color: var(--sky); font: 600 11px/1 "Segoe UI", sans-serif; margin-left: 10px; }
  .shared.on { display: inline-flex; }

  /* --- resting pill --- */
  #rest { display: flex; align-items: center; padding: 0 12px 0 10px; height: 34px; }
  #rest .clock { margin-left: auto; font: 600 13px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: .2px; }
  .timerchip { display: none; align-items: center; gap: 5px; margin-left: 10px; font: 600 12px/1 "Segoe UI", sans-serif; color: var(--amber); }
  .timerchip.on { display: flex; }
  .timerchip .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--amber); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  /* --- hover dashboard --- */
  #hover { display: grid; grid-template-columns: 150px 1fr; gap: 18px; padding: 16px 22px 18px; }
  .bigtime { font: 600 34px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -.5px; }
  .date { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .week { display: flex; gap: 6px; margin-top: 14px; }
  .day { width: 18px; text-align: center; font-size: 10px; color: var(--faint); }
  .day b { display: block; font-size: 12px; color: var(--dim); font-weight: 600; margin-top: 3px; }
  .day.today b { color: #fff; background: var(--violet); border-radius: 9px; height: 18px; line-height: 18px; }
  .ask { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 6px 0 16px; border-radius: 23px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.10); }
  .ask input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: 15px "Segoe UI", sans-serif; }
  .ask input::placeholder { color: var(--faint); }
  .mic { width: 36px; height: 36px; border-radius: 18px; border: 0; cursor: pointer; display: grid; place-items: center;
    background: linear-gradient(135deg, #B45CFF, #FF4F9A); color: #fff; transition: transform .2s var(--spring); }
  .mic:hover { transform: scale(1.08); }
  .mic:active { transform: scale(.94); }
  .hint { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; color: var(--dim); background: rgba(255,255,255,.07); border-radius: 12px; padding: 5px 10px; }
  .chip.link { cursor: pointer; color: var(--sky); }
  .chip kbd { font: 600 11px "Segoe UI", sans-serif; color: #fff; }

  /* --- session card --- */
  #session { padding: 12px 22px 18px; }
  .head { display: flex; align-items: center; gap: 10px; height: 36px; }
  .status { font: 600 12px/1 "Segoe UI", sans-serif; letter-spacing: 1.4px; color: var(--faint); text-transform: uppercase; }
  .bars { display: flex; gap: 3px; align-items: center; height: 16px; margin-left: auto; }
  .bars i { width: 3px; border-radius: 2px; height: 4px; background: linear-gradient(#3FC8FF, #B45CFF); transition: height .08s linear; }
  .x { width: 28px; height: 28px; border-radius: 14px; border: 0; background: rgba(255,255,255,.10); color: var(--dim);
    cursor: pointer; display: grid; place-items: center; margin-left: 10px; }
  .x:hover { background: rgba(255,255,255,.18); color: #fff; }
  .transcript { font: 500 19px/1.35 "Segoe UI Variable Display", "Segoe UI", sans-serif; margin-top: 8px; min-height: 26px; }
  .transcript.placeholder { color: var(--faint); }
  .reply { font-size: 15px; line-height: 1.5; color: rgba(244,241,255,.84); margin-top: 10px; max-height: 260px; overflow-y: auto;
    opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .45s var(--spring); }
  .reply.on { opacity: 1; transform: none; }
  .reply::-webkit-scrollbar { width: 6px; } .reply::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
  .sources { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .src { display: inline-flex; align-items: center; gap: 6px; max-width: 190px; font-size: 12px; color: var(--dim);
    background: rgba(255,255,255,.08); border-radius: 12px; padding: 5px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src:hover { background: rgba(255,255,255,.14); color: #fff; }
  .src::before { content: ''; width: 7px; height: 7px; border-radius: 4px; background: var(--sky); flex: none; }
  .foot { display: flex; align-items: center; justify-content: center; margin-top: 14px; position: relative; }
  .foot .gear { position: absolute; right: 0; background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 16px; }
  .foot .gear:hover { color: #fff; }
  canvas.orb { flex: none; }

  /* ---------------- Sports (Apple Sports-style) ---------------- */
  .num, .goalword { font-family: "Bahnschrift", "Roboto Condensed", "Arial Narrow", sans-serif; font-stretch: condensed; font-weight: 700; }
  #island.score { width: 300px; height: 34px; }
  #island.card, #island.goal { width: 600px; height: 176px; border-radius: 0 0 32px 32px; }
  body.m-score #shL { left: calc(50% - 150px - 16px); } body.m-score #shR { left: calc(50% + 150px); }
  body.m-card #shL, body.m-goal #shL { left: calc(50% - 300px - 16px); } body.m-card #shR, body.m-goal #shR { left: calc(50% + 300px); }
  .badge { flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 9px/1 "Segoe UI", sans-serif; letter-spacing: .2px; }
  #score { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 7px; cursor: pointer; }
  #score .num { font-size: 19px; line-height: 1; }
  #score .clk { flex: 1; text-align: center; color: var(--dim); font: 600 11.5px/1 "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .live { width: 5px; height: 5px; border-radius: 3px; background: #FF453A; animation: blink 1.6s ease-in-out infinite; }
  .board { position: absolute; inset: 0; }
  .board .bg { position: absolute; inset: 0; }
  .board .shade { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.35), transparent 40%, rgba(0,0,0,.55)); }
  .board .in { position: relative; padding: 12px 26px 12px; display: flex; flex-direction: column; height: 100%; }
  .board .lg { text-align: center; color: var(--dim); font: 600 11.5px/1 "Segoe UI", sans-serif; }
  .board .row { display: flex; align-items: center; margin-top: 8px; }
  .board .team { width: 74px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .board .team span { color: var(--dim); font: 600 12px/1 "Segoe UI", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 74px; }
  .board .big { font-size: 54px; line-height: 1; margin: 0 14px; min-width: 32px; text-align: center; }
  .board .big.lose { color: var(--dim); }
  .board .big.smallbig { font-size: 40px; margin: 0 8px; }
  .board .mid { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .board .mid b { font: 600 18px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; }
  .board .mid i { font: 700 9.5px/1 "Segoe UI", sans-serif; letter-spacing: 1px; color: var(--faint); font-style: normal; display: flex; align-items: center; gap: 5px; }
  .board .play { margin-top: 12px; display: flex; gap: 10px; align-items: stretch; font: 500 14px/1.35 "Segoe UI", sans-serif; }
  .board .play::before { content: ''; width: 3px; border-radius: 2px; background: rgba(255,255,255,.35); flex: none; }
  .board .dots { display: flex; justify-content: center; gap: 5px; margin-top: auto; }
  .board .dots u { width: 5px; height: 5px; border-radius: 3px; background: var(--faint); text-decoration: none; }
  .board .dots u.on { background: #fff; }
  /* rolling number: old slides out the top, new rises in on a spring */
  .rollbox { display: inline-block; height: 1em; overflow: hidden; vertical-align: top; }
  .rollbox > span { display: flex; flex-direction: column; transition: transform .6s cubic-bezier(.3, 1.5, .5, 1); }
  .rollbox > span > b { height: 1em; font-weight: inherit; }
  .rollbox.go > span { transform: translateY(-1em); }
  /* the score moment (Premier League broadcast style) */
  #goal canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  #goal .ride { position: absolute; inset: 0; }
  #goal .gbadge { position: absolute; top: 50%; margin-top: -30px; opacity: 0; transform: scale(2.4) rotate(-12deg); }
  #goal .gbadge .badge { box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 8px 24px rgba(0,0,0,.35); }
  #goal.on .gbadge { animation: slam .6s cubic-bezier(.3, 1.7, .5, 1) .32s forwards; }
  #goal .words { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #goal .who-team { font: 700 11.5px/1 "Segoe UI", sans-serif; letter-spacing: 2.6px; opacity: 0; }
  #goal .chant { position: absolute; font-style: italic; letter-spacing: 3px; white-space: nowrap; opacity: 0; }
  #goal .goalword { line-height: 1; letter-spacing: 2px; display: flex; margin: 6px 0 4px; }
  #goal .goalword > span { position: relative; display: inline-block; overflow: hidden; padding: 0 1px; }
  #goal .goalword i, #goal .goalword em { display: inline-block; font-style: normal; transform: translateY(105%); }
  #goal .goalword em { position: absolute; left: 1px; top: 0; color: transparent; -webkit-text-stroke: 1.5px var(--light); opacity: .9; }
  #goal.on .goalword i { animation: rise .6s cubic-bezier(.3, 1.55, .5, 1) forwards; }
  #goal.on .goalword em { animation: echo .7s cubic-bezier(.2, .8, .2, 1) forwards; }
  #goal .scorer { font: 600 14px/1.2 "Segoe UI", sans-serif; opacity: 0; max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes slam { 0% { opacity: 0; transform: scale(2.4) rotate(-12deg); } 30% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  @keyframes rise { to { transform: none; } }
  @keyframes echo { 0% { transform: translateY(120%); opacity: .9; } 60% { opacity: .6; } 100% { transform: translateY(-30%); opacity: 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: .92; transform: none; } }
  @keyframes chantFly { 0% { opacity: 0; transform: translateX(calc(var(--dir) * -260px)) scaleX(1.3); } 30%, 62% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(calc(var(--dir) * 260px)) scaleX(1.3); } }
  @keyframes rideOut { to { opacity: 0; transform: translateX(calc(var(--dir) * 90px)); } }
  /* preview only (?phone): the phone's compact layout, clock beside the right score so the camera stays clear */
  body.phone #island.score { width: 406px; height: 54px; border-radius: 27px; top: 6px; }
  body.phone #island.card, body.phone #island.goal { top: 6px; border-radius: 48px; }
  body.phone .shoulder { display: none; }
  body.phone .board .in { padding-top: 46px; } body.phone .board .in > .lg { display: none; } body.phone #askChip { display: none; }
  .board .mid .lg2 { display: none; } body.phone .board .mid .lg2 { display: block; color: var(--dim); font: 600 12px/1 "Segoe UI", sans-serif; }
  body.phone #island.card, body.phone #island.goal { height: 190px; }
  body.phone #score { height: 54px; padding: 0 12px; } body.phone #score .num { font-size: 27px; }
  body.phone #score .clk { justify-content: flex-end; font-size: 15px; padding-right: 6px; }
  @keyframes flood { to { transform: scale(1); } }
  @keyframes floodOut { to { opacity: 0; } }
  @keyframes flash { 0% { opacity: .6; } 100% { opacity: 0; } }
  @keyframes shine { 0% { opacity: 1; left: var(--from); } 100% { opacity: 0; left: var(--to); } }
  @keyframes letter { to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: .92; transform: none; } }
  @keyframes leave { to { opacity: 0; transform: translateY(-34px) scale(1.12); } }
  @keyframes boardIn { to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="glowShadow"></div>
<div class="shoulder" id="shL"></div><div class="shoulder" id="shR"></div>
<div id="island" class="hidden">
  <div id="rim"></div>

  <div class="view" id="score"></div>
  <div class="view" id="card"></div>
  <div class="view" id="goal"></div>

  <div class="view" id="rest">
    <canvas class="orb" id="orbSmall" width="44" height="44" style="width:22px;height:22px"></canvas>
    <div class="timerchip" id="timerRest"><span class="dot"></span><span></span></div>
    <div class="clickchip" id="clickRest" title="Stop auto-click">⚡ <span></span></div>
    <div class="clock" id="clockSmall">--:--</div>
  </div>

  <div class="view" id="hover">
    <div>
      <div class="bigtime" id="clockBig">--:--</div>
      <div class="date" id="dateLine"></div>
      <div class="week" id="week"></div>
    </div>
    <div>
      <div class="ask">
        <input id="askInput" placeholder="Ask Nebula anything…" spellcheck="false">
        <button class="mic" id="micBtn" title="Talk">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
      </div>
      <div class="hint" id="hints"></div>
    </div>
  </div>

  <div class="view" id="hud">
    <span class="tag">⚡ R3CKET</span>
    <span id="hudTime">0:00</span>
    <span class="sp"></span>
    <span><span class="k">PING</span><span id="hudPing">—</span></span>
    <span><span class="k">CPU</span><span id="hudCpu">—</span></span>
    <span><span class="k">RAM</span><span id="hudRam">—</span></span>
    <span class="x" id="hudCross" title="Crosshair (Ctrl+Alt+X)">⌖</span>
  </div>

  <div class="view" id="game">
    <canvas class="orb" id="orbGame" width="52" height="52" style="width:26px;height:26px"></canvas>
    <span class="tag">R3CKET</span>
    <div class="line" id="gameLine">Listening…</div>
    <div class="bars" id="bars2"><i></i><i></i><i></i><i></i><i></i></div>
    <button class="x" id="closeBtn2" title="Close" style="margin-left:4px">✕</button>
  </div>

  <div class="view" id="session">
    <div class="head">
      <canvas class="orb" id="orbBig" width="68" height="68" style="width:34px;height:34px"></canvas>
      <div class="status" id="status">Listening</div>
      <span class="shared" id="shared" title="Nebula can see your screen">◉ Screen</span>
      <div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div>
      <button class="x" id="closeBtn" title="Close">✕</button>
    </div>
    <div class="transcript placeholder" id="transcript">Listening…</div>
    <div class="reply" id="reply"></div>
    <div class="sources" id="sources"></div>
    <div class="foot">
      <div class="chip" id="followHint">Just keep talking — I'm listening for a follow-up</div>
      <button class="gear" id="gearBtn" title="Settings">⚙</button>
    </div>
  </div>
</div>

<script>
const api = window.nebula || { send() {}, on() {}, invoke: async () => ({}) };
const $ = (id) => document.getElementById(id);
const island = $('island');

let state = { active: false, phase: 'idle', transcript: '', reply: '', sources: [], timerEndsAt: 0, hasKey: true, hotkey: 'Alt+Space', wakeEnabled: true };
let hovering = false; let interactive = false; let level = 0;

// ---------------------------------------------------------------- layout
function mode() {
  if (state.active) return state.gaming ? 'game' : 'session';
  if (goal) return 'goal';
  if (state.hud && !hovering) return 'hud';
  const typing = document.activeElement === $('askInput') && $('askInput').value;
  if (liveGame() && hovering && !askMode && !typing) return 'card';
  if (hovering || typing) return 'hover';
  if (liveGame()) return 'score';
  return 'rest';
}

function render() {
  const m = mode();
  island.classList.toggle('hidden', false);
  island.classList.toggle('hover', m === 'hover');
  island.classList.toggle('session', m === 'session');
  island.classList.toggle('game', m === 'game');
  island.classList.toggle('hud', m === 'hud');
  for (const k of ['score', 'card', 'goal']) island.classList.toggle(k, m === k);
  if (m === 'score') renderScore();
  if (m === 'card') renderCard();
  const ckOn = !!(state.clicker && state.clicker.running);
  document.body.className = `m-${m}${m === 'rest' && ckOn ? ' m-clicking' : ''}${PHONE ? ' phone' : ''}`;
  if (m === 'hud') renderHud();
  island.classList.toggle('awake', state.active);
  island.classList.toggle('thinking', state.phase === 'thinking');
  $('glowShadow').classList.toggle('on', state.active);
  for (const v of ['rest', 'hover', 'session', 'game', 'hud', 'score', 'card']) $(v).classList.toggle('on', v === m);
  if (m !== 'goal') $('goal').classList.remove('on');
  if (m !== 'hover' && !hovering) askMode = false;
  if (m === 'game') {

  if (m === 'game') {

    [...$('bars2').children].forEach((b, i) => {
      const wob = 0.55 + 0.45 * Math.sin(t * 9 + i * 1.3);
      b.style.height = `${4 + 12 * Math.min(1, (0.15 + 0.85 * shownLevel) * wob)}px`;
    });
  }
  if (m === 'session') {
    drawOrb($('orbBig'), t, shownLevel, state.phase);
    [...$('bars').children].forEach((b, i) => {
      const wob = 0.55 + 0.45 * Math.sin(t * 9 + i * 1.3);
      b.style.height = `${4 + 12 * Math.min(1, (0.15 + 0.85 * shownLevel) * wob)}px`;
    });
  }
  // Light on the laptop: full frame rate only while Nebula is awake or you're hovering; the resting pill ticks at 8 fps.
  if (state.active || hovering) requestAnimationFrame(loop);
  else { last = 0; setTimeout(() => requestAnimationFrame(loop), 125); }
}
requestAnimationFrame(loop);

// ---------------------------------------------------------------- wiring
api.on('island:state', (s) => { state = { ...state, ...s }; render(); });
api.on('island:level', (l) => { level = l; });
api.on('island:speak', speak);
api.on('island:speak-stop', stopSpeaking);
api.on('island:audio', onAudio);
api.on('island:sound', playSound);
api.on('island:goal', playGoal);
api.on('island:timer-done', () => {
  try {
    const ctx = new AudioContext();
    [0, 0.25, 0.5].forEach((d) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(0.0001, ctx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.2);
      o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.22);
    });
  } catch {}
});

// Preview hooks for testing: island.html?demo=session|hover|rest
const q = new URLSearchParams(location.search);
if (q.has('demo')) {
  const d = q.get('demo');
  if (d === 'hover') hovering = true;
  if (d === 'session') state = { ...state, active: true, phase: q.get('phase') || 'done',
    transcript: "What's the weather like in Johannesburg this weekend?",
    reply: "It's looking warm and mostly sunny, around 27 degrees on Saturday, with a chance of afternoon thunderstorms on Sunday, so maybe keep an umbrella handy.",
    sources: [{ title: 'weather.com', url: 'https://weather.com' }, { title: 'Windy.com', url: 'https://windy.com' }] };
  if (d === 'game') state = { ...state, active: true, gaming: true, phase: 'done', reply: 'Your squad is still in the lobby — two more players to go.' };
  if (d === 'clicker') state.clicker = { running: true, clicks: 1284 };
  if (d === 'hud') state.hud = { since: Date.now() - 754000, ping: 34, cpu: 41, ram: 63, crosshair: true };
  if (d === 'followup') state = { ...state, active: true, phase: 'listening', followup: true, screenShare: true, reply: 'It will be warm and mostly sunny on Saturday, around 27°.' };
  if (d === 'rest') state.timerEndsAt = Date.now() + 4 * 60 * 1000 + 32 * 1000;
  const demoGame = { id: 'demo', league: { name: 'Premier League', kind: 'soccer' }, state: 'in', live: true, clock: "67'", lastPlay: "S. Dlamini 67'",
    home: { abbr: 'JHB', name: 'Lions', score: 1, color: '#f2b01e' }, away: { abbr: 'CPT', name: 'Comets', score: 1, color: '#2f6bff' } };
  if (d === 'score' || d === 'card' || d === 'goal') state.sports = [demoGame];
  if (d === 'card') hovering = true;
  const demoRugby = { id: 'dr', league: { name: 'Nations Championship', kind: 'rugby' }, state: 'in', live: true, clock: "47'", lastPlay: "C. Kolbe 47'",
    home: { abbr: 'RSA', name: 'South Africa', score: 15, text: '15', color: '#00704a' }, away: { abbr: 'ENG', name: 'England', score: 14, text: '14', color: '#c8102e' } };
  const demoCricket = { id: 'dc', league: { name: 'T20I · 2nd T20I', kind: 'cricket' }, state: 'in', live: true, clock: '17.5 ov', lastPlay: 'South Africa need 16 runs from 13 balls',
    home: { abbr: 'SA', name: 'South Africa', score: 167, text: '167/5', sub: '17.5 ov', color: '#00843d' }, away: { abbr: 'AUS', name: 'Australia', score: 182, text: '182/7', sub: '20 ov', color: '#f2b51c' } };
  if (d === 'try' || d === 'trycard') state.sports = [demoRugby];
  if (d === 'six' || d === 'sixcard') state.sports = [demoCricket];
  if (d === 'trycard' || d === 'sixcard') hovering = true;
  if (d === 'goal') setTimeout(() => playGoal({ game: demoGame, home: false, before: '0', label: q.get('label') || 'GOAL', who: demoGame.lastPlay, chant: q.get('chant') || '', at: Date.now() }), 300);
  if (d === 'try') setTimeout(() => playGoal({ game: demoRugby, home: true, before: '10', label: 'TRY', who: "C. Kolbe 47'", chant: 'BOKKE', at: Date.now() }), 300);
  if (d === 'six') setTimeout(() => playGoal({ game: demoCricket, home: true, before: '161/5', label: 'SIX', who: demoCricket.lastPlay, chant: 'PROTEAS', at: Date.now() }), 300);
}
render();
</script>
