<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nebula island</title>
<style>
  @property --spin { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  :root {
    --text: #F4F1FF; --dim: rgba(244,241,255,.66); --faint: rgba(244,241,255,.40);
    --violet: #9B6CFF; --rose: #FF4F9A; --sky: #3FC8FF; --mint: #5CF2B0; --amber: #FFC266;
    --spring: cubic-bezier(.32, 1.42, .56, 1);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text);
    -webkit-font-smoothing: antialiased; user-select: none; }

  /* The island hangs from the top edge: flat top, rounded bottom, like a notch. */
  #island {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 210px; height: 34px; border-radius: 0 0 18px 18px;
    background: #000; overflow: hidden;
    transition: width .62s var(--spring), height .62s var(--spring), border-radius .5s var(--ease), opacity .3s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  #island.hidden { width: 120px; height: 0; opacity: 0; }
  #island.hover { width: 640px; height: 150px; border-radius: 0 0 30px 30px; }
  #island.session { width: 600px; border-radius: 0 0 32px 32px; }
  /* R3cket: a slim bar over games */
  #island.game { width: 540px; height: 40px; border-radius: 0 0 20px 20px; }
  #game { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px 0 10px; }
  #game .line { flex: 1; font: 500 13.5px/1 "Segoe UI", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #game .tag { font: 700 10px/1 "Segoe UI", sans-serif; letter-spacing: 1.2px; color: var(--amber); }
  .clickchip { display: none; align-items: center; gap: 5px; margin-left: 10px; font: 600 12px/1 "Segoe UI", sans-serif; color: var(--mint); cursor: pointer; }
  .clickchip.on { display: flex; }
  #island.clicking:not(.hover):not(.session):not(.game) { width: 270px; }

  /* Flowing Vibrance rim while Nebula is awake. */
  #rim { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
    transition: opacity .5s ease; padding: 1.4px;
    background: conic-gradient(from var(--spin), #3FC8FF, #5B6CFF, #B45CFF, #FF4F9A, #FF8A3D, #9BE15D, #3FC8FF);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: spin 6s linear infinite; }
  #island.awake #rim { opacity: .9; }
  #island.thinking #rim { animation-duration: 1.6s; }
  @keyframes spin { to { --spin: 360deg; } }
  #glowShadow { position: absolute; left: 50%; top: 0; transform: translateX(-50%); width: 600px; height: 40px;
    pointer-events: none; opacity: 0; transition: opacity .6s ease, width .62s var(--spring); filter: blur(28px);
    background: conic-gradient(from var(--spin), #3FC8FF, #B45CFF, #FF4F9A, #FF8A3D, #3FC8FF); animation: spin 6s linear infinite; }
  #glowShadow.on { opacity: .55; }

  /* Content morph: old view blurs out fast, new one un-blurs in once the shape is on its way (like the references). */
  .view { position: absolute; inset: 0; opacity: 0; pointer-events: none; filter: blur(8px); transform: scale(.97); transform-origin: 50% 0;
    transition: opacity .14s ease, filter .14s ease, transform .2s ease; }
  .view.on { opacity: 1; pointer-events: auto; filter: none; transform: none;
    transition: opacity .32s ease .14s, filter .38s ease .12s, transform .5s var(--spring) .1s; }

  /* Curved shoulders that join the island to the top edge of the screen (moves in step with the island). */
  .shoulder { position: absolute; top: 0; width: 16px; height: 16px; pointer-events: none; opacity: 1;
    transition: left .62s var(--spring), opacity .3s ease; }
  #shL { left: calc(50% - 105px - 16px); background: radial-gradient(circle at 0 100%, transparent 15.5px, #000 16px); }
  #shR { left: calc(50% + 105px); background: radial-gradient(circle at 100% 100%, transparent 15.5px, #000 16px); }
  body.m-hidden .shoulder { opacity: 0; }
  body.m-hover #shL { left: calc(50% - 320px - 16px); } body.m-hover #shR { left: calc(50% + 320px); }
  body.m-session #shL { left: calc(50% - 300px - 16px); } body.m-session #shR { left: calc(50% + 300px); }
  body.m-game #shL, body.m-hud #shL { left: calc(50% - 270px - 16px); } body.m-game #shR, body.m-hud #shR { left: calc(50% + 270px); }
  body.m-clicking #shL { left: calc(50% - 135px - 16px); } body.m-clicking #shR { left: calc(50% + 135px); }

  /* R3cket HUD while you play */
  #island.hud { width: 540px; height: 34px; }
  #hud { display: flex; align-items: center; gap: 14px; height: 34px; padding: 0 14px; font: 600 12.5px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; }
  #hud .tag { color: #B8FF3D; letter-spacing: 1.2px; font-size: 10.5px; font-weight: 700; }
  #hud .k { color: var(--faint); font-size: 10px; letter-spacing: .8px; margin-right: 4px; font-weight: 700; }
  #hud .sp { flex: 1; }
  #hud .x { cursor: pointer; color: #B8FF3D; }
  .shared { display: none; align-items: center; gap: 5px; color: var(--sky); font: 600 11px/1 "Segoe UI", sans-serif; margin-left: 10px; }
  .shared.on { display: inline-flex; }

  /* --- resting pill --- */
  #rest { display: flex; align-items: center; padding: 0 12px 0 10px; height: 34px; }
  #rest .clock { margin-left: auto; font: 600 13px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: .2px; }
  .timerchip { display: none; align-items: center; gap: 5px; margin-left: 10px; font: 600 12px/1 "Segoe UI", sans-serif; color: var(--amber); }
  .timerchip.on { display: flex; }
  .timerchip .dot { width: 6px; height: 6px; border-radius: 3px; background: var(--amber); animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }

  /* --- hover dashboard --- */
  #hover { display: grid; grid-template-columns: 150px 1fr; gap: 18px; padding: 16px 22px 18px; }
  .bigtime { font: 600 34px/1 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -.5px; }
  .date { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .week { display: flex; gap: 6px; margin-top: 14px; }
  .day { width: 18px; text-align: center; font-size: 10px; color: var(--faint); }
  .day b { display: block; font-size: 12px; color: var(--dim); font-weight: 600; margin-top: 3px; }
  .day.today b { color: #fff; background: var(--violet); border-radius: 9px; height: 18px; line-height: 18px; }
  .ask { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 6px 0 16px; border-radius: 23px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.10); }
  .ask input { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font: 15px "Segoe UI", sans-serif; }
  .ask input::placeholder { color: var(--faint); }
  .mic { width: 36px; height: 36px; border-radius: 18px; border: 0; cursor: pointer; display: grid; place-items: center;
    background: linear-gradient(135deg, #B45CFF, #FF4F9A); color: #fff; transition: transform .2s var(--spring); }
  .mic:hover { transform: scale(1.08); }
  .mic:active { transform: scale(.94); }
  .hint { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; color: var(--dim); background: rgba(255,255,255,.07); border-radius: 12px; padding: 5px 10px; }
  .chip.link { cursor: pointer; color: var(--sky); }
  .chip kbd { font: 600 11px "Segoe UI", sans-serif; color: #fff; }

  /* --- session card --- */
  #session { padding: 12px 22px 18px; }
  .head { display: flex; align-items: center; gap: 10px; height: 36px; }
  .status { font: 600 12px/1 "Segoe UI", sans-serif; letter-spacing: 1.4px; color: var(--faint); text-transform: uppercase; }
  .bars { display: flex; gap: 3px; align-items: center; height: 16px; margin-left: auto; }
  .bars i { width: 3px; border-radius: 2px; height: 4px; background: linear-gradient(#3FC8FF, #B45CFF); transition: height .08s linear; }
  .x { width: 28px; height: 28px; border-radius: 14px; border: 0; background: rgba(255,255,255,.10); color: var(--dim);
    cursor: pointer; display: grid; place-items: center; margin-left: 10px; }
  .x:hover { background: rgba(255,255,255,.18); color: #fff; }
  .transcript { font: 500 19px/1.35 "Segoe UI Variable Display", "Segoe UI", sans-serif; margin-top: 8px; min-height: 26px; }
  .transcript.placeholder { color: var(--faint); }
  .reply { font-size: 15px; line-height: 1.5; color: rgba(244,241,255,.84); margin-top: 10px; max-height: 260px; overflow-y: auto;
    opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .45s var(--spring); }
  .reply.on { opacity: 1; transform: none; }
  .reply::-webkit-scrollbar { width: 6px; } .reply::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 3px; }
  .sources { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .src { display: inline-flex; align-items: center; gap: 6px; max-width: 190px; font-size: 12px; color: var(--dim);
    background: rgba(255,255,255,.08); border-radius: 12px; padding: 5px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src:hover { background: rgba(255,255,255,.14); color: #fff; }
  .src::before { content: ''; width: 7px; height: 7px; border-radius: 4px; background: var(--sky); flex: none; }
  .foot { display: flex; align-items: center; justify-content: center; margin-top: 14px; position: relative; }
  .foot .gear { position: absolute; right: 0; background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 16px; }
  .foot .gear:hover { color: #fff; }
  canvas.orb { flex: none; }

  /* ---------------- Sports (Apple Sports-style) ---------------- */
  .num, .goalword { font-family: "Bahnschrift", "Roboto Condensed", "Arial Narrow", sans-serif; font-stretch: condensed; font-weight: 700; }
  #island.score { width: 300px; height: 34px; }
  #island.card, #island.goal { width: 600px; height: 176px; border-radius: 0 0 32px 32px; }
  body.m-score #shL { left: calc(50% - 150px - 16px); } body.m-score #shR { left: calc(50% + 150px); }
  body.m-card #shL, body.m-goal #shL { left: calc(50% - 300px - 16px); } body.m-card #shR, body.m-goal #shR { left: calc(50% + 300px); }
  .logo { flex: none; display: grid; place-items: center; } .logo img { object-fit: contain; display: block; }
  .logo.ring { border-radius: 50%; background: rgba(255,255,255,.94); box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 8px 24px rgba(0,0,0,.35); }
  .badge { flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 9px/1 "Segoe UI", sans-serif; letter-spacing: .2px; }
  #score { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 7px; cursor: pointer; }
  #score .num { font-size: 19px; line-height: 1; }
  #score .clk { flex: 1; text-align: center; color: var(--dim); font: 600 11.5px/1 "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .live { width: 5px; height: 5px; border-radius: 3px; background: #FF453A; animation: blink 1.6s ease-in-out infinite; }
  .board { position: absolute; inset: 0; }
  .board .bg { position: absolute; inset: 0; overflow: hidden; }
  /* live gradient: both team colours drift like a slow lava lamp, with a passing sheen */
  .board .blob { position: absolute; width: 520px; height: 520px; border-radius: 50%; top: 50%; margin-top: -260px; opacity: .55; filter: blur(4px); }
  .board .blob.h { left: -260px; animation: drift 9s ease-in-out infinite; }
  .board .blob.a { right: -260px; animation: drift 9s ease-in-out -4.5s infinite reverse; }
  .board .sheen { position: absolute; top: 0; bottom: 0; width: 180px; background: linear-gradient(100deg, transparent, rgba(255,255,255,.07), transparent); animation: sheen 6s linear infinite; }
  @keyframes drift { 0%, 100% { transform: translate(0, -60px); } 50% { transform: translate(40px, 60px); } }
  @keyframes sheen { from { left: -200px; } to { left: 700px; } }
  .cardchips { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
  .cardchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; background: rgba(0,0,0,.25); font: 600 11.5px/1 "Segoe UI", sans-serif; }
  .mini { width: 8px; height: 11px; border-radius: 2px; transform: rotate(-8deg); display: inline-block; }
  .mini.yellow { background: #FFD60A; } .mini.red, .mini.red20 { background: #E5172F; }
  .cd { font-family: "Bahnschrift", "Roboto Condensed", sans-serif; font-weight: 700; }
  /* card moment */
  #goal .cardm { position: absolute; inset: 0; display: flex; align-items: center; gap: 22px; padding: 0 34px; }
  #goal .pcard { width: 62px; height: 86px; border-radius: 8px; flex: none; position: relative; overflow: hidden; opacity: 0; transform: perspective(500px) rotateY(-110deg) rotate(-32deg) scale(.6); }
  #goal.on .pcard { animation: cardIn .9s cubic-bezier(.3, 1.5, .5, 1) .12s forwards; }
  #goal .pcard::after { content: ''; position: absolute; top: -20%; bottom: -20%; width: 40px; left: -60px; background: linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent); }
  #goal.on .pcard::after { animation: cardShine .65s ease .76s forwards; }
  #goal .cwords { opacity: 0; transform: translateX(24px); }
  #goal.on .cwords { animation: cwIn .42s cubic-bezier(.2, .8, .2, 1) .38s forwards; }
  #goal .cwords .lab { font-size: 46px; line-height: 1; letter-spacing: 1px; }
  #goal .cwords .who { font: 600 18px/1.2 "Segoe UI", sans-serif; margin-top: 2px; }
  #goal .cwords .meta { display: flex; align-items: center; gap: 7px; color: var(--dim); font: 700 10.5px/1 "Segoe UI", sans-serif; letter-spacing: 1.6px; }
  #goal .cwords .tag { margin-top: 8px; display: flex; align-items: baseline; gap: 10px; color: var(--faint); font: 700 10.5px/1 "Segoe UI", sans-serif; letter-spacing: 1.4px; }
  @keyframes cardIn { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 1; transform: rotate(-8deg); } }
  @keyframes cardShine { to { left: 90px; } }
  @keyframes cwIn { to { opacity: 1; transform: none; } }
  /* substitution board */
  #goal .subb { position: absolute; left: 18px; right: 18px; top: 14px; bottom: 14px; border-radius: 18px; background: #050608; overflow: hidden;
    background-image: radial-gradient(rgba(255,255,255,.05) .8px, transparent 1px); background-size: 5px 5px; transform: translateY(110%); }
  #goal.on .subb { animation: boardUp .7s cubic-bezier(.3, 1.35, .5, 1) .08s forwards; }
  #goal .subb .hd { display: flex; align-items: center; gap: 10px; padding: 10px 20px 2px; color: #FFB020; text-shadow: 0 0 10px rgba(255,176,32,.8); font-size: 18px; letter-spacing: 3px; }
  #goal .subb .hd .m { margin-left: auto; letter-spacing: 1px; }
  #goal .subb .pair { padding: 1px 22px; opacity: 0; }
  #goal.on .subb .pair { animation: flicker .3s steps(6) forwards; }
  #goal .subb .on, #goal .subb .off { font-size: 19px; line-height: 1.08; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #goal .subb .on { color: #3DFF7A; text-shadow: 0 0 12px rgba(61,255,122,.75); }
  #goal .subb .off { color: #FF4D4D; text-shadow: 0 0 12px rgba(255,77,77,.75); }
  @keyframes boardUp { to { transform: none; } }
  @keyframes stripes { to { transform: translateX(48px); } }
  /* liquid glass rim on every opened card: bright top edge, bevel, depth at the bottom */
  #glass { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 60; opacity: 0; transition: opacity .35s;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.42), inset 0 0 0 1px rgba(255,255,255,.07), inset 0 -18px 30px -14px rgba(0,0,0,.45);
    background: linear-gradient(rgba(255,255,255,.08), transparent 22%, transparent 80%, rgba(0,0,0,.18)); }
  #island.musiccard #glass, #island.card #glass, #island.goal #glass, #island.session #glass, #island.hud #glass { opacity: 1; }
  body.m-hover #glass { opacity: 1; }

  /* ---------------- now playing, themed by the album art ---------------- */
  #island.music { width: 330px; height: 34px; } #island.musiccard { width: 600px; height: 200px; border-radius: 0 0 32px 32px; }
  body.m-music #shL { left: calc(50% - 165px - 16px); } body.m-music #shR { left: calc(50% + 165px); }
  body.m-musiccard #shL { left: calc(50% - 300px - 16px); } body.m-musiccard #shR { left: calc(50% + 300px); }
  #music { display: flex; align-items: center; gap: 9px; height: 34px; padding: 0 10px 0 6px; cursor: pointer; }
  #music .halves { position: absolute; inset: 0; transition: background .9s; }
  #music > *:not(.halves) { position: relative; }
  #music img { width: 24px; height: 24px; border-radius: 7px; object-fit: cover; }
  #music .mt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; font: 600 12px/1 "Segoe UI", sans-serif; }
  #music .mt span { display: inline-block; padding-left: 0; }
  #music .mt.long span { animation: marq 12s linear infinite; padding-right: 40px; }
  @keyframes marq { 0%, 12% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .eqb { display: flex; gap: 2px; align-items: center; height: 14px; } .eqb i { width: 3px; border-radius: 2px; background: var(--acc, #a55cff); height: 30%; }
  .eqb.on i { animation: eq .9s ease-in-out infinite; } .eqb i:nth-child(2) { animation-delay: -.3s; } .eqb i:nth-child(3) { animation-delay: -.6s; } .eqb i:nth-child(4) { animation-delay: -.15s; }
  @keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
  /* liquid glass: the cover blurred is the light behind the glass; bright top edge, bevel, drifting sheen */
  #musiccard { position: absolute; inset: 0; cursor: default; overflow: hidden; border-radius: inherit; }
  #musiccard .back { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(38px) saturate(1.25); transform: scale(1.25);
    animation: backDrift 18s ease-in-out infinite alternate; transition: opacity .9s; }
  @keyframes backDrift { from { transform: scale(1.3) translate(-14px, -6px); } to { transform: scale(1.4) translate(14px, 6px); } }
  #musiccard .tint { position: absolute; inset: 0; transition: background .7s; }
  #musiccard .sheen { position: absolute; top: 0; bottom: 0; width: 260px; background: linear-gradient(105deg, transparent, rgba(255,255,255,.12), transparent); animation: sheenX 9s linear infinite; }
  @keyframes sheenX { from { left: -300px; } to { left: 700px; } }
  #musiccard canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #musiccard .tile { position: absolute; left: 30px; top: 42px; width: 128px; height: 128px; border-radius: 30px; overflow: hidden;
    box-shadow: 0 18px 36px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.3); animation: floaty 4.2s ease-in-out infinite; }
  #musiccard .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #musiccard .tile::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(135deg, rgba(255,255,255,.3), transparent 55%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55); }
  #musiccard .tile.bloom img { animation: bloomIn .65s cubic-bezier(.2, .8, .2, 1); }
  @keyframes bloomIn { from { filter: blur(14px); transform: scale(.86); opacity: 0; } to { filter: none; transform: none; opacity: 1; } }
  @keyframes floaty { 0%, 100% { transform: perspective(600px) rotateY(6deg) rotateX(3deg) translateY(0); } 50% { transform: perspective(600px) rotateY(-6deg) rotateX(-3deg) translateY(-3px); } }
  #musiccard .info { position: absolute; left: 186px; right: 30px; top: 40px; bottom: 16px; display: flex; flex-direction: column; justify-content: center; transition: color .7s; }
  #musiccard .tiw { overflow: hidden; }
  #musiccard .tiw.fade { -webkit-mask-image: linear-gradient(90deg, transparent, #000 18px, #000 calc(100% - 18px), transparent); }
  #musiccard .ti { font: 600 28px/1.15 "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -.2px; white-space: nowrap; display: inline-block; }
  #musiccard .ti.scroll { animation: tiScroll var(--dur, 12s) linear 2.2s infinite; }
  @keyframes tiScroll { 0% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--to, 0)); } }
  #musiccard .ti.in { animation: tiIn .45s ease; } @keyframes tiIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  #musiccard .ar { font: 500 15px/1.3 "Segoe UI", sans-serif; opacity: .66; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #musiccard .ctl { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  #musiccard .ctl button { background: none; border: 0; color: inherit; cursor: pointer; padding: 4px; display: grid; place-items: center; transition: transform .15s; }
  #musiccard .ctl button:hover { transform: scale(1.1); }
  #musiccard .ctl .pp { width: 46px; height: 46px; border-radius: 50%; background: color-mix(in srgb, currentColor 14%, transparent);
    box-shadow: inset 0 1px 0 color-mix(in srgb, currentColor 45%, transparent), inset 0 0 0 1px color-mix(in srgb, currentColor 10%, transparent); }
  #musiccard .ctl .pp svg { transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); } #musiccard .ctl .pp.morph svg { transform: scale(.4); }
  #musiccard .track { position: relative; height: 12px; margin-top: 12px; }
  #musiccard .track .ln { position: absolute; left: 0; right: 0; top: 4px; height: 4px; border-radius: 2px; background: currentColor; opacity: .18; }
  #musiccard .track .fl { position: absolute; left: 0; top: 4px; height: 4px; border-radius: 2px; background: currentColor; transition: width .25s linear; }
  #musiccard .track .kn { position: absolute; top: 1px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 5px var(--glow, rgba(255,255,255,.25)); transition: left .25s linear; }
  #musiccard .times { display: flex; justify-content: space-between; margin-top: 4px; font: 600 10.5px/1 "Segoe UI", sans-serif; opacity: .66; }

  /* compact score: each half in its team's colour, the competition's logo at the seam */

<body>

  <div class="view" id="musiccard"></div>

  <div class="view" id="goal"></div>

<script>
const api = window.nebula || { send() {}, on() {}, invoke: async () => ({}) };
const $ = (id) => document.getElementById(id);
const island = $('island');

let state = { active: false, phase: 'idle', transcript: '', reply: '', sources: [], timerEndsAt: 0, hasKey: true, hotkey: 'Alt+Space', wakeEnabled: true };
let hovering = false; let interactive = false; let level = 0;

// ---------------------------------------------------------------- layout
function mode() {
  if (state.active) return state.gaming ? 'game' : 'session';
  if (goal) return 'goal';
  if (state.hud && !hovering) return 'hud';
  const typing = document.activeElement === $('askInput') && $('askInput').value;
  if (liveGame() && hovering && !askMode && !typing) return 'card';
  if (!liveGame() && state.media && hovering && !askMode && !typing) return 'musiccard';
  if (hovering || typing) return 'hover';
  if (liveGame()) return 'score';
  if (state.media && state.media.playing) return 'music';
  return 'rest';
}

function render() {
  const m = mode();
  island.classList.toggle('hidden', false);
  island.classList.toggle('hover', m === 'hover');
  island.classList.toggle('session', m === 'session');
  island.classList.toggle('game', m === 'game');
  island.classList.toggle('hud', m === 'hud');
  for (const k of ['score', 'card', 'goal', 'music', 'musiccard']) island.classList.toggle(k, m === k);
  if (m === 'music') renderMusic();
  if (m === 'musiccard') renderMusicCard();
  if (m === 'score') renderScore();
  if (m === 'card') renderCard();
  const ckOn = !!(state.clicker && state.clicker.running);
  document.body.className = `m-${m}${m === 'rest' && ckOn ? ' m-clicking' : ''}${PHONE ? ' phone' : ''}`;
  if (m === 'hud') renderHud();
  island.classList.toggle('awake', state.active);
  island.classList.toggle('thinking', state.phase === 'thinking');
  $('glowShadow').classList.toggle('on', state.active);
  for (const v of ['rest', 'hover', 'session', 'game', 'hud', 'score', 'card', 'music', 'musiccard']) $(v).classList.toggle('on', v === m);
  if (m !== 'goal') $('goal').classList.remove('on');
  if (m !== 'hover' && !hovering) askMode = false;
  if (m === 'game') {
    const labels = { listening: 'Listening…', thinking: 'Thinking…', error: 'Hmm' };
    $('gameLine').textContent = (state.phase !== 'listening' && state.reply) || state.transcript || labels[state.phase] || 'Nebula';
    $('bars2').style.visibility = state.phase === 'listening' ? 'visible' : 'hidden';
  }
  const ck = state.clicker || {};
  $('clickRest').classList.toggle('on', !!ck.running);
  island.classList.toggle('clicking', !!ck.running);
  if (ck.running) $('clickRest').lastElementChild.textContent = `${(ck.clicks || 0).toLocaleString()} clicks`;

  if (m === 'session') {
    const labels = { listening: state.followup ? 'Listening for a follow-up' : 'Listening', thinking: 'Thinking', speaking: 'Nebula', done: 'Nebula', error: 'Hmm' };
    $('status').textContent = labels[state.phase] || 'Nebula';
    $('shared').classList.toggle('on', !!state.screenShare);
    $('followHint').style.display = state.phase === 'listening' && state.followup ? '' : 'none';
    const t = state.transcript || (state.phase === 'listening' ? (state.followup ? 'Anything else?' : 'Listening…') : '');
    $('transcript').textContent = t;
    $('transcript').classList.toggle('placeholder', !state.transcript);
    $('reply').textContent = state.reply || '';
    $('reply').classList.toggle('on', !!state.reply);
    $('bars').style.visibility = state.phase === 'listening' ? 'visible' : 'hidden';
    $('sources').innerHTML = '';
    for (const s of state.sources || []) {
      const el = document.createElement('div');
      el.className = 'src'; el.textContent = s.title; el.title = s.url;
      el.onclick = () => api.send('open:url', s.url);
      $('sources').appendChild(el);
    }
    // Grow to fit the content (springy, like the phone island).
    requestAnimationFrame(() => {
      const h = Math.min(500, $('session').scrollHeight + 2);
      island.style.height = `${Math.max(150, h)}px`;
    });
  } else {
    const lg0 = liveGame() || {};
    island.style.height = m === 'card' ? `${(lg0.lastPlay ? 176 : 158) + (lg0.note ? 20 : 0) + ((lg0.cards || []).length ? 26 : 0) + ((lg0.stats || []).length ? 22 + 18 * Math.min(4, lg0.stats.length) : 0)}px` : '';
  }

  const hints = $('hints');
  hints.innerHTML = '';
  if (!state.hasKey) {
    const c = document.createElement('div'); c.className = 'chip link'; c.textContent = 'Add your Groq key in Settings ›';
    c.onclick = () => api.send('open:settings'); hints.appendChild(c);
  } else {
    hints.insertAdjacentHTML('beforeend', `<div class="chip">Press <kbd>${state.hotkey}</kbd></div>`);
    if (state.wakeEnabled) hints.insertAdjacentHTML('beforeend', '<div class="chip">or say “Hey Nebula”</div>');
    const c = document.createElement('div'); c.className = 'chip link'; c.textContent = 'Settings';
    c.onclick = () => api.send('open:settings'); hints.appendChild(c);
  }
  updateTimer();
}

function renderHud() {
  const h = state.hud || {};
  const s = Math.max(0, Math.floor((Date.now() - (h.since || Date.now())) / 1000));
  $('hudTime').textContent = s >= 3600 ? `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}` : `${Math.floor(s / 60)}:${pad(s % 60)}`;
  const ping = h.ping; $('hudPing').textContent = ping == null ? '—' : `${ping}ms`;
  $('hudPing').style.color = ping == null ? '' : ping < 60 ? '#5CF2B0' : ping < 120 ? '#FFC266' : '#FF5A5A';
  $('hudCpu').textContent = h.cpu == null ? '—' : `${h.cpu}%`;
  $('hudRam').textContent = h.ram == null ? '—' : `${h.ram}%`;
  $('hudCross').style.opacity = h.crosshair ? '1' : '.45';
}
setInterval(() => { if (mode() === 'hud') renderHud(); }, 1000);

// ---------------------------------------------------------------- now playing
/**
 * Song themes, from the album art: "mono" (black-and-white covers: brushed silver, dark type, a spotlight and grain),
 * "vivid" (the cover's two strongest colours, blobs drifting), "night" (dark covers: deep tones, a glow, rising specks).
 */
const themeCache = new Map();
const DEFAULT_THEME = { style: 'night', bg1: '#1c1430', bg2: '#0b0b10', slab: 'rgba(255,255,255,.13)', accent: '#a55cff', text: '#ffffff', blobs: ['#a55cff', '#4d8dff'] };
function songTheme(art) {
  if (!art) return Promise.resolve(DEFAULT_THEME);
  if (themeCache.has(art)) return themeCache.get(art);
  const p = new Promise((resolve) => {
    const im = new Image();
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 24; const g = c.getContext('2d'); g.drawImage(im, 0, 0, 24, 24);
        const d = g.getImageData(0, 0, 24, 24).data; let sat = 0, lum = 0; const B = Array.from({ length: 12 }, () => [0, 0, 0, 0]);
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i] / 255, gg = d[i + 1] / 255, b = d[i + 2] / 255, mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), v = mx, sv = mx ? (mx - mn) / mx : 0;
          let h = 0; if (mx !== mn) h = mx === r ? ((gg - b) / (mx - mn) + 6) % 6 : mx === gg ? (b - r) / (mx - mn) + 2 : (r - gg) / (mx - mn) + 4;
          sat += sv * v; lum += .2126 * r + .7152 * gg + .0722 * b;
          if (sv > .25 && v > .2) { const k = Math.min(11, Math.floor(h * 2)); const w = sv * v; B[k][0] += w; B[k][1] += r * w; B[k][2] += gg * w; B[k][3] += b * w; }
        }
        const n = d.length / 4; sat /= n; lum /= n;
        const col = (k) => `rgb(${[1, 2, 3].map((j) => Math.round(B[k][j] / B[k][0] * 255)).join(',')})`;

  goalTimer = setTimeout(endMoment, 5200 + 900 * Math.max(0, (s.subs || []).length - 1));
}
$('score').onclick = () => { hovering = true; render(); };
$('card').onclick = () => { const n = (state.sports || []).length; if (n > 1) { gameIdx++; $('card').dataset.k = ''; render(); } };
$('goal').onclick = () => { clearTimeout(goalTimer); endMoment(); };

// Nebula's sounds: wake (Open), thinking, error.
const SOUNDS = {};
function playSound(name) {
  try {
    const a = SOUNDS[name] || (SOUNDS[name] = new Audio(`sounds/${name}.ogg`));
    a.currentTime = 0; a.volume = 0.8; a.play().catch(() => {});
  } catch {}
}

// ---------------------------------------------------------------- clocks + timer
function pad(n) { return String(n).padStart(2, '0'); }
function tick() {
  const d = new Date();
  const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('clockSmall').textContent = time;
  $('clockBig').textContent = time;
  $('dateLine').textContent = d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  const week = $('week');
  if (week.dataset.day !== String(d.getDate())) {
    week.dataset.day = String(d.getDate());
    week.innerHTML = '';
    for (let i = -3; i <= 3; i++) {
      const x = new Date(d); x.setDate(d.getDate() + i);
      week.insertAdjacentHTML('beforeend',
        `<div class="day ${i === 0 ? 'today' : ''}">${x.toLocaleDateString([], { weekday: 'narrow' })}<b>${x.getDate()}</b></div>`);
    }
  }
  updateTimer();
}
function updateTimer() {
  const left = Math.max(0, Math.round((state.timerEndsAt - Date.now()) / 1000));
  const chip = $('timerRest');
  chip.classList.toggle('on', left > 0);
  if (left > 0) {
    const h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
    chip.lastElementChild.textContent = h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }
}
setInterval(tick, 1000); tick();

// ---------------------------------------------------------------- mouse: only the island catches clicks
document.addEventListener('mousemove', (e) => {
  const r = island.getBoundingClientRect();
  const inside = e.clientX >= r.left - 6 && e.clientX <= r.right + 6 && e.clientY <= r.bottom + 6 && r.height > 4;
  if (inside !== interactive) { interactive = inside; api.send('island:interactive', inside); }
  if (inside && !hovering) { clearTimeout(window.__leave); window.__enter = setTimeout(() => { hovering = true; render(); }, 110); }
  if (!inside && hovering) { clearTimeout(window.__enter); window.__leave = setTimeout(() => { hovering = false; render(); }, 380); }
  if (!inside) clearTimeout(window.__enter);
});
document.addEventListener('mouseleave', () => { if (interactive) { interactive = false; api.send('island:interactive', false); } });

$('askInput').addEventListener('focus', () => api.send('island:focus'));
$('askInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.value.trim()) { api.send('island:ask', e.target.value.trim()); e.target.value = ''; e.target.blur(); hovering = false; }
  if (e.key === 'Escape') { e.target.value = ''; e.target.blur(); }
});
$('micBtn').onclick = () => { hovering = false; api.send('island:talk'); };

// ---------------------------------------------------------------- speech out
let speakingToken = null; let speakFallback = null;
function speak({ text, voice, token }) {
  stopSpeaking();
  speakingToken = token;
  const done = () => { if (speakingToken === token) { speakingToken = null; clearTimeout(speakFallback); api.send('island:spoken', token); } };
  try {
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const v = voices.find((x) => x.name === voice) ||
      voices.find((x) => /natural|online/i.test(x.name) && /^en/i.test(x.lang)) ||
      voices.find((x) => /^en/i.test(x.lang));
    if (v) u.voice = v;
    u.rate = 1.03;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  } catch { /* fall through to the timer */ }
  speakFallback = setTimeout(done, 2500 + text.length * 85); // never get stuck
}
function stopSpeaking() {
  speakingToken = null; clearTimeout(speakFallback); try { speechSynthesis.cancel(); } catch {}
  audioQ = []; audioLast = false; audioToken = null;
  if (curAudio) { try { curAudio.pause(); } catch {} curAudio = null; }
}

// Natural voice: WAV clips arrive one sentence group at a time and play back to back.
let audioQ = []; let audioToken = null; let audioLast = false; let curAudio = null;
function onAudio({ token, b64, last }) {
  if (audioToken !== token) { stopSpeaking(); audioToken = token; }
  if (b64) audioQ.push(b64);
  if (last) audioLast = true;
  if (!curAudio) playNext();
}
function playNext() {
  if (!audioQ.length) {
    if (audioLast && audioToken !== null) { const t = audioToken; audioToken = null; audioLast = false; api.send('island:spoken', t); }
    return;
  }
  const bin = atob(audioQ.shift());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
  const a = new Audio(url); curAudio = a;
  const next = () => { URL.revokeObjectURL(url); if (curAudio === a) { curAudio = null; playNext(); } };
  a.onended = next; a.onerror = next;
  a.play().catch(next);
}

// ---------------------------------------------------------------- orbs + voice bars
function drawOrb(canvas, t, lvl, phase) {
  const g = canvas.getContext('2d');
  const W = canvas.width, c = W / 2, r = W * 0.36 * (1 + 0.14 * lvl);
  g.clearRect(0, 0, W, W);
  const halo = g.createRadialGradient(c, c, r * 0.4, c, c, r * 1.4);
  halo.addColorStop(0, phase === 'error' ? 'rgba(255,120,80,.45)' : 'rgba(155,108,255,.45)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = halo; g.fillRect(0, 0, W, W);
  g.save();
  g.beginPath();
  for (let i = 0; i <= 48; i++) {
    const a = i / 48 * Math.PI * 2;
    const w = 1 + 0.03 * Math.sin(3 * a + t * 1.7) + 0.02 * Math.sin(5 * a - t * 2.3) + 0.05 * lvl * Math.sin(4 * a + t * 5);
    const x = c + Math.cos(a) * r * w, y = c + Math.sin(a) * r * w;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath(); g.clip();
  g.fillStyle = '#0d0a1f'; g.fillRect(0, 0, W, W);
  const cols = phase === 'error' ? ['#FF6A3D', '#FFB347', '#B45CFF'] :
    phase === 'thinking' ? ['#FF4F9A', '#3FC8FF', '#B45CFF'] : ['#9B6CFF', '#3FC8FF', '#FF6FD8'];
  g.globalCompositeOperation = 'screen';
  cols.forEach((col, i) => {
    const a = t * (0.9 + i * 0.37) + i * 2.1;
    const x = c + Math.cos(a) * r * 0.42, y = c + Math.sin(a * 1.3) * r * 0.42;
    const gr = g.createRadialGradient(x, y, 0, x, y, r * 0.95);
    gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, W);
  });
  g.globalCompositeOperation = 'source-over';
  const hl = g.createRadialGradient(c - r * .34, c - r * .4, 0, c - r * .34, c - r * .4, r * .5);
  hl.addColorStop(0, 'rgba(255,255,255,.55)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = hl; g.fillRect(0, 0, W, W);
  g.restore();
}

let t = 0; let last = 0; let shownLevel = 0;
function loop(now) {
  const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016; last = now;
  const speed = { thinking: 2.6, speaking: 1.4, listening: 1 }[state.phase] || 0.4;
  t += dt * speed;
  const target = state.phase === 'listening' ? level : state.phase === 'speaking' ? 0.3 + 0.25 * Math.sin(t * 7) : 0;
  shownLevel += (target - shownLevel) * (1 - Math.exp(-12 * dt));
  const m = mode();
  if (m === 'rest') drawOrb($('orbSmall'), t, shownLevel, state.phase);
  if (m === 'game') {
    drawOrb($('orbGame'), t, shownLevel, state.phase);
    [...$('bars2').children].forEach((b, i) => {
      const wob = 0.55 + 0.45 * Math.sin(t * 9 + i * 1.3);
      b.style.height = `${4 + 12 * Math.min(1, (0.15 + 0.85 * shownLevel) * wob)}px`;
    });
  }
  if (m === 'session') {
    drawOrb($('orbBig'), t, shownLevel, state.phase);
    [...$('bars').children].forEach((b, i) => {
      const wob = 0.55 + 0.45 * Math.sin(t * 9 + i * 1.3);
      b.style.height = `${4 + 12 * Math.min(1, (0.15 + 0.85 * shownLevel) * wob)}px`;
    });
  }
  // Light on the laptop: full frame rate only while Nebula is awake or you're hovering; the resting pill ticks at 8 fps.
  if (state.active || hovering) requestAnimationFrame(loop);
  else { last = 0; setTimeout(() => requestAnimationFrame(loop), 125); }
}
requestAnimationFrame(loop);

// ---------------------------------------------------------------- wiring
api.on('island:state', (s) => { state = { ...state, ...s }; render(); });
api.on('island:level', (l) => { level = l; });
api.on('island:speak', speak);
api.on('island:speak-stop', stopSpeaking);
api.on('island:audio', onAudio);
api.on('island:sound', playSound);
api.on('island:goal', playGoal);
api.on('island:timer-done', () => {
  try {
    const ctx = new AudioContext();
    [0, 0.25, 0.5].forEach((d) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(0.0001, ctx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.2);
      o.connect(g).connect(ctx.destination); o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.22);
    });
  } catch {}
});
