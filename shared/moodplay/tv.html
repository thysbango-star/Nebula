<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood PLAY</title>
<style>
  /* Mood PLAY — the TV screen. Served by Nebula (phone or PC) over your Wi-Fi and opened in the TV's browser.
     Everything is drawn on a 1920×1080 stage that's scaled to fit the TV, so it looks the same on every set. */
  /* The font travels with the page, so every TV draws it the same (TV browsers have very few fonts of their own). */
  @font-face { font-family: "MoodSans"; src: url("f/manrope_medium.ttf") format("truetype"); font-weight: 300 500; }
  @font-face { font-family: "MoodSans"; src: url("f/manrope_bold.ttf") format("truetype"); font-weight: 600 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  body { font-family: "MoodSans", "Open Sans", "Samsung One", "SamsungOne", "LG Smart", "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; color: var(--ink); --ink: #111; --sub: #111; --knob: #fff; --pill-a: #ff3a2a; --pill-b: #ff8f3f; }
  /* TVs crop the edges of the picture (overscan): the backgrounds fill the screen, the content stays in the safe middle. */
  #content { position: absolute; inset: 0; transform: scale(var(--safe, .94)); transform-origin: 50% 50%; z-index: 3; }
  .scene { position: absolute; inset: 0; opacity: 0; transition: opacity 1.1s ease; }
  .scene.on { opacity: 1; }
  .fill { position: absolute; inset: 0; }

  /* logo: m(pill)od PLAY */
  .logo { position: absolute; left: 40px; top: 18px; display: flex; align-items: center; font-weight: 600; font-size: 74px; letter-spacing: -3px; line-height: 1; color: var(--ink); z-index: 5; transition: color 1s; }
  .logo .pill { display: inline-block; width: 96px; height: 46px; border-radius: 24px; border: 6px solid var(--ink); margin: 14px 0 0 -2px;
    background: linear-gradient(90deg, var(--pill-a), var(--pill-b)); box-shadow: inset 0 3px 6px rgba(255,255,255,.35); transition: border-color 1s; }
  .logo .od { margin-left: -2px; }
  .logo b { font-weight: 400; letter-spacing: 1px; margin-left: 18px; font-size: 58px; }

  /* the player */
  #ui { position: absolute; inset: 0; z-index: 4; transition: opacity .6s; }
  .art { position: absolute; left: 372px; top: 243px; width: 400px; height: 400px; border-radius: 72px; overflow: hidden; background: #222;
    box-shadow: 0 30px 60px rgba(0,0,0,.28); transform-origin: 50% 60%; }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .art.flip { animation: flip .9s cubic-bezier(.25, 1.35, .45, 1); }
  @keyframes flip { 0% { transform: perspective(1400px) rotateY(-75deg) scale(.82); opacity: 0; filter: blur(14px); } 60% { filter: none; opacity: 1; } 100% { transform: none; opacity: 1; } }
  .art .noart { position: absolute; inset: 0; display: grid; place-items: center; font-size: 160px; color: rgba(255,255,255,.55); background: linear-gradient(135deg, #3b3b48, #15151b); }
  .meta { position: absolute; left: 832px; top: 330px; width: 960px; }
  .title { font-size: 104px; font-weight: 400; line-height: 1.12; letter-spacing: -1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title.long { font-size: 82px; }
  .artist { font-size: 64px; font-weight: 700; line-height: 1.2; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--sub); }
  .album { font-size: 34px; font-weight: 500; opacity: .62; margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .in { animation: up .7s cubic-bezier(.2, .9, .2, 1) both; } .meta .in2 { animation: up .7s .08s cubic-bezier(.2, .9, .2, 1) both; } .meta .in3 { animation: up .7s .16s cubic-bezier(.2, .9, .2, 1) both; }
  @keyframes up { from { opacity: 0; transform: translateY(36px); } to { opacity: 1; transform: none; } }
  .time { position: absolute; top: 722px; font-size: 48px; font-weight: 400; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .time.a { left: 338px; } .time.b { left: 1598px; }
  .bar { position: absolute; left: 541px; top: 746px; width: 940px; height: 7px; border-radius: 4px; background: var(--ink); }
  /* moved with transform only (no layout, no repaint) — cheap on a TV's small graphics chip */
  .bar .knob { position: absolute; left: 0; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--knob);
    box-shadow: 0 2px 8px rgba(0,0,0,.35); transition: transform .5s linear; will-change: transform; }
  .bar .done { position: absolute; left: 0; top: -2px; bottom: -2px; width: 100%; border-radius: 6px; background: var(--ink); transform-origin: 0 50%; transition: transform .5s linear; will-change: transform; }
  .ctls { position: absolute; left: 520px; top: 812px; width: 990px; height: 110px; display: flex; justify-content: space-between; align-items: center; }
  .ctl { position: relative; width: 110px; height: 110px; display: grid; place-items: center; border-radius: 28px; color: var(--ink); background: none; border: 0; outline: none; transition: transform .15s, background .2s; }
  .ctl svg { fill: currentColor; stroke: currentColor; }
  .ctl.big svg { width: 76px; height: 82px; } .ctl.mid svg { width: 64px; height: 76px; } .ctl.small svg { width: 54px; height: 54px; }
  .ctl .dot { position: absolute; left: 50%; bottom: 6px; width: 13px; height: 13px; margin-left: -6px; border-radius: 50%; background: currentColor; opacity: 0; transition: opacity .3s; }
  .ctl.active .dot { opacity: 1; } .ctl.dim { opacity: .35; }
  .ctl .one { position: absolute; top: 16px; right: 22px; font: 800 22px/1 sans-serif; opacity: 0; } .ctl.one .one { opacity: 1; }
  body.keys .ctl:focus { background: rgba(127,127,127,.18); box-shadow: 0 0 0 4px var(--ink); }
  .ctl.press { transform: scale(.88); }
  .from { position: absolute; right: 48px; top: 34px; font-size: 26px; font-weight: 600; opacity: .7; color: var(--ink); display: flex; align-items: center; gap: 12px; letter-spacing: .5px; }
  .from i { width: 14px; height: 14px; border-radius: 50%; background: #34d27b; box-shadow: 0 0 12px #34d27b; }

  /* centred layout (the glow theme, like the TV's own now-playing screen) */
  #stage.centre .art { left: 735px; top: 150px; width: 450px; height: 450px; border-radius: 26px; box-shadow: 0 40px 120px rgba(0,0,0,.55); }
  #stage.centre .meta { left: 260px; width: 1400px; top: 640px; text-align: center; }
  #stage.centre .title { font-size: 68px; font-weight: 700; letter-spacing: 0; }
  #stage.centre .artist { font-size: 44px; font-weight: 600; opacity: .85; }
  #stage.centre .album { display: none; }
  #stage.centre .time { top: 858px; font-size: 30px; opacity: .7; } #stage.centre .time.a { left: 520px; } #stage.centre .time.b { left: 1312px; }
  #stage.centre .bar { left: 640px; top: 876px; width: 640px; height: 5px; opacity: .85; }
  #stage.centre .bar .knob { width: 20px; height: 20px; margin: -10px 0 0 -10px; }
  #stage.centre .ctls { left: 660px; top: 920px; width: 600px; height: 90px; transform: scale(.72); transform-origin: 50% 0; opacity: .9; }

  /* themes ---------------------------------------------------------------- */
  .t-waves .bg { background: linear-gradient(180deg, var(--w1, #a7adba), var(--w2, #2c2f3b)); }
  /* each bundle of lines is drawn once into its own layer; only that layer moves */
  .t-waves .wl, .t-waves .wr { position: absolute; inset: 0; will-change: transform; }
  .t-waves .wl svg, .t-waves .wr svg { position: absolute; inset: 0; }
  .t-waves .wl { animation: sway 11s ease-in-out infinite alternate; transform-origin: 0 50%; }
  .t-waves .wr { animation: sway 13s ease-in-out -4s infinite alternate-reverse; transform-origin: 100% 30%; }
  @keyframes sway { from { transform: translate(-14px, 10px) rotate(-1.6deg); } to { transform: translate(12px, -12px) rotate(1.8deg); } }

  .t-shards .bg { background: linear-gradient(100deg, var(--s1, #b4b4b4), var(--s2, #e6e6e6) 55%, var(--s3, #f7f7f7)); }
  .t-shards .cl { position: absolute; inset: 0; will-change: transform; animation: drift 10s ease-in-out infinite alternate; }
  .t-shards .cl.r { animation-duration: 12s; animation-delay: -5s; }
  .t-shards .shard { position: absolute; left: 0; top: 0; transition: transform 1.2s cubic-bezier(.2, .9, .2, 1); }
  .t-shards .shard svg { display: block; overflow: visible; }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(6px, -12px); } }
  .t-shards.burst .shard { transform: translate(var(--bx), var(--by)) rotate(var(--br)) scale(.6) !important; }

  .t-arcs .bg { background: radial-gradient(70% 90% at 70% 10%, var(--a1, #fde1e6), transparent 70%), radial-gradient(70% 90% at 20% 100%, var(--a2, #fdf1e2), transparent 70%), linear-gradient(120deg, var(--a3, #f4eef0), var(--a4, #e9e3f0)); }
  .t-arcs .arcw { position: absolute; inset: 0; will-change: transform; animation: breathe 9s ease-in-out infinite alternate; transform-origin: 0 100%; }
  .t-arcs svg { position: absolute; inset: 0; }
  .t-arcs path { stroke-dasharray: 2400; stroke-dashoffset: 0; }
  .t-arcs.draw path { animation: drawin 1.6s cubic-bezier(.3, .8, .2, 1) both; }
  @keyframes drawin { from { stroke-dashoffset: 2400; } }
  @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.025) translateY(-6px); } }

  .t-glow { background: #0b0c2a; }
  /* the cover, shrunk to a few pixels and stretched back up: a soft glow with no blur filter to compute */
  .t-glow .blur { position: absolute; inset: -160px; background-size: cover; background-position: center; opacity: .8; transform: scale(1.15); animation: glowdrift 24s ease-in-out infinite alternate; will-change: transform; }
  @keyframes glowdrift { from { transform: scale(1.15) translate(-40px, -20px); } to { transform: scale(1.3) translate(40px, 25px); } }
  .t-glow .rays { position: absolute; left: 50%; top: 36%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0 8%, rgba(255,255,255,.09) 10%, transparent 13% 30%, rgba(255,255,255,.07) 33%, transparent 36% 55%, rgba(255,255,255,.08) 58%, transparent 61% 80%, rgba(255,255,255,.06) 83%, transparent 86%);
    animation: spin 90s linear infinite; will-change: transform; }
  .t-glow .shade { position: absolute; inset: 0; background: radial-gradient(60% 60% at 50% 36%, transparent, rgba(5,5,25,.55)); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .t-vinyl .bg { background: linear-gradient(135deg, var(--v1, #f1e7da), var(--v2, #d9c7b4)); }
  .t-vinyl .record { position: absolute; left: 520px; top: 255px; width: 376px; height: 376px; border-radius: 50%;
    background: radial-gradient(circle, var(--vl, #e33) 0 17%, #111 17.5% 18%, #0d0d0d 18.5%), repeating-radial-gradient(circle, rgba(255,255,255,.05) 0 1px, transparent 1px 5px);
    background-blend-mode: normal; box-shadow: 0 25px 50px rgba(0,0,0,.35); transition: left 1.1s cubic-bezier(.2, .9, .2, 1); }
  .t-vinyl .record::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 30deg, transparent, rgba(255,255,255,.12) 8%, transparent 16%, transparent 50%, rgba(255,255,255,.1) 58%, transparent 66%); }
  .t-vinyl .record.out { left: 588px; }
  #stage.wide .meta { left: 1010px; width: 840px; } .t-vinyl .record.spin { animation: spin 2.4s linear infinite; }

  .t-dots .bg { background: linear-gradient(135deg, var(--d1, #ff8a3d), var(--d2, #d3255a)); }
  .t-dots .pat { position: absolute; inset: -80px; background-image: radial-gradient(circle, var(--dd, rgba(255,255,255,.35)) 28%, transparent 30%); background-size: 46px 46px; opacity: .7; animation: pan 16s linear infinite; will-change: transform; }
  .t-dots .fade { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 0%, var(--d1) 40%, var(--d2) 60%, transparent 100%); opacity: .85; }
  @keyframes pan { to { transform: translate(46px, 46px); } }

  /* idle: the hills, the clouds and the sheep */
  .t-idle .sky { position: absolute; inset: 0; background: linear-gradient(180deg, #c6e9fd, #e9f8fe 62%); }
  .t-idle .cloud { position: absolute; animation: cloud linear infinite; }
  @keyframes cloud { from { transform: translateX(-500px); } to { transform: translateX(2400px); } }
  .t-idle .sheep { position: absolute; left: 0; top: 0; animation: graze 70s linear infinite; }
  @keyframes graze { 0% { transform: translate(40px, 588px); } 22% { transform: translate(330px, 600px); } 30% { transform: translate(330px, 600px); } 55% { transform: translate(760px, 690px) scaleX(1); } 56% { transform: translate(760px, 690px) scaleX(-1); } 90% { transform: translate(260px, 596px) scaleX(-1); } 91%, 100% { transform: translate(260px, 596px) scaleX(1); } }
  .t-idle .sheep svg { animation: bob .5s ease-in-out infinite alternate; } @keyframes bob { to { transform: translateY(-3px); } }
  .idlemsg { position: absolute; left: 0; right: 0; top: 380px; text-align: center; color: #1f3b1a; z-index: 4; }
  .idlemsg h1 { font-size: 72px; font-weight: 700; letter-spacing: -1px; } .idlemsg p { font-size: 38px; opacity: .7; margin-top: 12px; }

  .toast { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 16px 34px; border-radius: 40px; background: rgba(0,0,0,.72); color: #fff; font-size: 30px; font-weight: 600; z-index: 9; opacity: 0; transition: opacity .4s; }
  .toast.on { opacity: 1; }
  /* a slow TV: the decorations hold still (measured on the TV itself in the first seconds) */
  body.lite .scene *, body.lite .scene { animation-play-state: paused !important; }
  body.lite .scene { transition-duration: .3s; }
  .snd { display: none; } .snd.on { display: inline-block; width: 26px; height: 26px; }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="content">
  <div class="logo" id="logo"><span>m</span><i class="pill"></i><span class="od">od</span><b>PLAY</b></div>
  <div class="from" id="from" style="display:none"><i></i><span id="fromName"></span><svg class="snd" id="sndIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
  <div id="ui" style="opacity:0">
    <div class="art" id="art"></div>
    <div class="meta" id="meta"></div>
    <div class="time a" id="tA">0:00</div><div class="bar" id="bar"><div class="done" id="done"></div><div class="knob" id="knob"></div></div><div class="time b" id="tB">0:00</div>
    <div class="ctls">
      <button class="ctl small" id="cRepeat" data-c="repeat" tabindex="0" title="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M7 7h10l-2.5-2.5M17 17H7l2.5 2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12a5 5 0 0 1 2-4M19 12a5 5 0 0 1-2 4" fill="none" stroke-linecap="round"/></svg><span class="one">1</span><i class="dot"></i></button>
      <button class="ctl mid" data-c="prev" tabindex="0" title="Previous"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="2.6" height="16" rx="1"/><path d="M20 4v16L8 12z"/></svg></button>
      <button class="ctl big" id="cPlay" data-c="toggle" tabindex="0" title="Play / pause"><svg viewBox="0 0 24 24" id="playIcon"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg></button>
      <button class="ctl mid" data-c="next" tabindex="0" title="Next"><svg viewBox="0 0 24 24"><path d="M4 4v16l12-8z"/><rect x="17.4" y="4" width="2.6" height="16" rx="1"/></svg></button>
      <button class="ctl small" id="cShuffle" data-c="shuffle" tabindex="0" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4c4 0 6 10 10 10h4M18 14l3 3-3 3"/><path d="M3 17h4c1.6 0 2.8-1.4 3.8-3M14 9.6C15 8.2 16 7 17 7h4M18 4l3 3-3 3"/></svg><i class="dot"></i></button>
    </div>
  </div>
  <div class="idlemsg" id="idle" style="display:none"><h1 id="idleH">Connected</h1><p id="idleP">Play something on your phone</p></div>
  <div class="toast" id="toast"></div>
  </div>
</div>
<script>
'use strict';
// ---------------------------------------------------------------- wiring
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo');
const TOKEN = location.pathname.split('/').filter(Boolean)[0] || '';
const BASE = '/' + TOKEN + '/';
const stage = $('stage');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clock = (ms) => { const s = Math.max(0, Math.floor((ms || 0) / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

function fit() {
  // TVs crop the edges of the picture (overscan): keep everything inside the safe 94% in the middle.
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  if (DEMO) stage.style.setProperty('--safe', 1);
  stage.style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
}
addEventListener('resize', fit); fit();
// keep the picture moving a few pixels now and then, so a static screen never burns in
setInterval(() => { $('ui').style.translate = `${Math.round(Math.random() * 10 - 5)}px ${Math.round(Math.random() * 8 - 4)}px`; }, 90000);

let S = null, skew = 0, curKey = '', curTheme = '', pal = null;

// ---------------------------------------------------------------- colours from the cover
function palette(src) {
  return new Promise((resolve) => {
    if (!src) return resolve(null);
    const im = new Image();
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'); g.drawImage(im, 0, 0, 32, 32);
        const d = g.getImageData(0, 0, 32, 32).data; let sat = 0, lum = 0; const B = []; for (let i = 0; i < 12; i++) B.push([0, 0, 0, 0]);
        for (let i = 0; i < d.length; i += 4) {
          const r = d[i] / 255, gg = d[i + 1] / 255, b = d[i + 2] / 255, mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), sv = mx ? (mx - mn) / mx : 0;
          let h = 0; if (mx !== mn) h = mx === r ? ((gg - b) / (mx - mn) + 6) % 6 : mx === gg ? (b - r) / (mx - mn) + 2 : (r - gg) / (mx - mn) + 4;
          sat += sv * mx; lum += .2126 * r + .7152 * gg + .0722 * b;
          if (sv > .22 && mx > .2) { const k = Math.min(11, Math.floor(h * 2)), w = sv * mx; B[k][0] += w; B[k][1] += r * w; B[k][2] += gg * w; B[k][3] += b * w; }
        }
        const n = d.length / 4; sat /= n; lum /= n;
        const ranked = B.map((x, k) => [x[0], k]).filter((x) => x[0] > 0).sort((a, b) => b[0] - a[0]).map((x) => x[1]);
        const col = (k) => [1, 2, 3].map((j) => Math.round(B[k][j] / B[k][0] * 255));
        const main = ranked.length ? col(ranked[0]) : [128, 128, 128];
        const k2 = ranked.slice(1).find((k) => Math.min(Math.abs(k - ranked[0]), 12 - Math.abs(k - ranked[0])) >= 2);
        const second = k2 != null ? col(k2) : mix(main, [0, 0, 0], .45);
        resolve({ sat, lum, mono: sat < .1 || !ranked.length, main, second, vivid: sat > .32 });
      } catch (e) { resolve(null); }
    };
    im.onerror = () => resolve(null); im.src = src; tiny.img = im;
  });
}
// the cover at 12×12: stretched up, it's a soft blur that costs the TV nothing
let tinyCache = {};
function tiny(src) {
  if (!src) return ''; if (tinyCache[src]) return tinyCache[src];
  try { const im = tiny.img; if (!im || im.src.indexOf(src) < 0 || !im.complete) return ''; const c = document.createElement('canvas'); c.width = c.height = 12;
    c.getContext('2d').drawImage(im, 0, 0, 12, 12); return (tinyCache = { [src]: c.toDataURL() })[src]; } catch (e) { return ''; }
}
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const rgb = (a, al) => al == null ? `rgb(${a.join(',')})` : `rgba(${a.join(',')},${al})`;
const lumOf = (a) => (.2126 * a[0] + .7152 * a[1] + .0722 * a[2]) / 255;
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }

/** Auto: the cover picks the theme — black-and-white covers get the waves or the shards, soft ones the arcs, loud ones glow or dots. */
function autoTheme(p, key) {
  if (!p) return 'glow';
  if (p.mono) return p.lum > .5 ? 'shards' : 'waves';
  if (!p.vivid) return p.lum > .42 ? 'arcs' : 'vinyl';
  return ['glow', 'dots', 'vinyl'][hash(key) % 3];
}

// ---------------------------------------------------------------- scenes
const SVGNS = 'http://www.w3.org/2000/svg';
function waveBundle(d, cls) {
  // parallel lines along one curve: a mask of alternating strokes, so the lines sit on any gradient
  const id = 'm' + Math.random().toString(36).slice(2);
  const widths = [214, 196, 160, 142, 106, 88, 52, 34];
  return `<div class="${cls}"><svg viewBox="0 0 1920 1080" preserveAspectRatio="none"><mask id="${id}" maskUnits="userSpaceOnUse" x="-400" y="-400" width="2720" height="1880"><rect x="-400" y="-400" width="2720" height="1880" fill="#000"/>` +
    widths.map((w, i) => `<path d="${d}" fill="none" stroke="${i % 2 ? '#000' : '#fff'}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`).join('') +
    `</mask><rect x="-400" y="-400" width="2720" height="1880" fill="#0b0b0b" mask="url(#${id})"/></svg></div>`;
}
const SCENES = {
  waves(p) {
    const w1 = p && !p.mono ? rgb(mix(p.main, [190, 196, 210], .7)) : '#a7adba', w2 = p && !p.mono ? rgb(mix(p.second, [30, 32, 44], .75)) : '#2c2f3b';
    return { ink: '#0b0b0b', sub: '#0b0b0b', knob: '#fff', vars: { '--w1': w1, '--w2': w2 },
      html: `<div class="bg fill"></div>${waveBundle('M -80 250 C 170 300 230 470 130 565 S 10 770 175 860 S 330 1000 320 1180', 'wl')}${waveBundle('M 1540 -60 C 1470 120 1640 235 1770 330 S 1690 545 1780 645 S 1990 700 2040 760', 'wr')}` };
  },
  shards(p) {
    const s2 = p && !p.mono ? rgb(mix(p.main, [235, 235, 235], .8)) : '#e3e3e3';
    let h = '<div class="bg fill"></div>'; const cl = ['', ''];
    const fills = ['#0d0d0d', '#2a2a2a', '#5c5c5c', '#8a8a8a', '#a9a9a9', '#cfcfcf', '#ececec', '#ffffff'];
    let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let side = 0; side < 2; side++) for (let i = 0; i < 26; i++) {
      const x = side ? 1700 + r() * 230 : r() * 240, y = 190 + r() * 700, s = 30 + r() * 120;
      const pts = [[0, 0], [s * (0.4 + r() * 0.8), s * (0.1 + r() * 0.5)], [s * r() * 0.6, s * (0.6 + r() * 0.7)]].map((q) => q.join(',')).join(' ');
      const f = fills[Math.floor(r() * fills.length)], f2 = fills[Math.floor(r() * fills.length)];
      cl[side] += `<div class="shard" style="left:${x}px;top:${y}px;--bx:${(side ? 1 : -1) * (200 + r() * 400)}px;--by:${(r() - .5) * 500}px;--br:${(r() - .5) * 220}deg">` +
        `<svg width="${s * 1.3}" height="${s * 1.4}" style="transform:rotate(${(r() - .5) * 30}deg)"><polygon points="${pts}" fill="${f}"/>` +
        `<polygon points="${pts.split(' ').slice(0, 2).join(' ')} ${s * 0.3},${s * 0.35}" fill="${f2}" opacity=".55"/></svg></div>`;
    }
    h += `<div class="cl">${cl[0]}</div><div class="cl r">${cl[1]}</div>`;
    return { ink: '#0b0b0b', sub: '#0b0b0b', knob: '#111', vars: { '--s2': s2 }, html: h };
  },
  arcs(p) {
    const a1 = p ? rgb(mix(p.main, [255, 255, 255], .78)) : '#fde1e6', a2 = p ? rgb(mix(p.second, [255, 250, 240], .82)) : '#fdf1e2';
    const knob = p ? rgb(mix(p.main, [255, 255, 255], .55)) : '#f4c9e0';
    let paths = '';
    for (let i = 0; i < 14; i++) { // nested rounded corners: long lines at the top, curling down to the floor
      const y = 157 + i * 55, x = 252 - i * 7, rr = 120 + i * 28;
      paths += `<path d="M -30 ${y + 34 - i * 2} Q ${x * .5} ${y + 6} ${x - rr * .3} ${y} Q ${x} ${y} ${x} ${y + rr} L ${x - i * 6} 1140" fill="none" stroke="#0b0b0b" stroke-width="9" stroke-linecap="round" style="animation-delay:${i * 50}ms"/>`;
    }
    return { ink: '#0b0b0b', sub: '#0b0b0b', knob, vars: { '--a1': a1, '--a2': a2 }, html: `<div class="bg fill"></div><div class="arcw"><svg viewBox="0 0 1920 1080"><g>${paths}</g></svg></div>` };
  },
  glow(p, art) {
    return { ink: '#fff', sub: '#fff', knob: '#fff', centre: true, vars: {},
      html: `<div class="blur" style="background-image:url('${tiny(art) || art || ''}')"></div><div class="rays"></div><div class="shade"></div>` };
  },
  vinyl(p) {
    const base = p ? p.main : [214, 120, 80];
    const v1 = rgb(mix(base, [250, 244, 236], .72)), v2 = rgb(mix(p ? p.second : base, [190, 170, 150], .55));
    const dark = lumOf(mix(base, [250, 244, 236], .62)) < .45;
    return { ink: dark ? '#fff' : '#141414', sub: dark ? '#fff' : '#141414', knob: '#fff', wide: true, vars: { '--v1': v1, '--v2': v2, '--vl': rgb(base) },
      html: '<div class="bg fill"></div><div class="record" id="record"></div>' };
  },
  dots(p) {
    const d1 = p ? rgb(p.main) : '#ff8a3d', d2 = p ? rgb(mix(p.second, [0, 0, 0], .2)) : '#d3255a';
    const ink = p && lumOf(p.main) > .62 ? '#111' : '#fff';
    return { ink, sub: ink, knob: ink === '#fff' ? '#fff' : '#111', vars: { '--d1': d1, '--d2': d2, '--dd': ink === '#fff' ? 'rgba(255,255,255,.28)' : 'rgba(0,0,0,.2)' },
      html: '<div class="bg fill"></div><div class="pat"></div><div class="fade"></div>' };
  },
  idle() {
    const cloud = (w, x, y, d, o) => `<div class="cloud" style="left:${x}px;top:${y}px;animation-duration:${d}s;animation-delay:${-d * o}s"><svg width="${w}" height="${w * .52}" viewBox="0 0 300 156"><path d="M60 150h190a46 46 0 0 0 0-92 30 30 0 0 0-10 2A80 80 0 0 0 85 60a52 52 0 0 0-25 90z" fill="#fff"/></svg></div>`;
    const sheep = `<div class="sheep"><svg width="34" height="28" viewBox="0 0 34 28"><g fill="#fff" stroke="#bbb" stroke-width=".6"><circle cx="11" cy="12" r="6"/><circle cx="18" cy="10" r="6.5"/><circle cx="24" cy="13" r="5.5"/><circle cx="15" cy="16" r="5.5"/><circle cx="21" cy="17" r="5"/></g><ellipse cx="29" cy="11" rx="3.6" ry="3" fill="#333"/><g stroke="#333" stroke-width="2" stroke-linecap="round"><path d="M12 20v6M17 21v6M22 21v6M26 19v6"/></g></svg></div>`;
    return { ink: '#1f3b1a', sub: '#1f3b1a', knob: '#fff', idle: true, vars: {},
      html: `<div class="sky"></div>${cloud(320, 0, 120, 140, .1)}${cloud(220, 0, 90, 110, .6)}${cloud(260, 0, 210, 170, .35)}` +
        `<svg class="fill" viewBox="0 0 1920 1080" preserveAspectRatio="none" style="position:absolute;inset:0"><path d="M0 600 C 300 520 520 760 840 640 S 1420 690 1920 620 L1920 1080 L0 1080Z" fill="#c8df86"/>` +
        `<path d="M0 620 C 220 560 420 700 600 760 S 1000 700 1200 740 S 1600 770 1920 640 L1920 1080 L0 1080Z" fill="#8aa505"/></svg>${sheep}` };
  },
};
const THEMES = ['waves', 'shards', 'arcs', 'glow', 'vinyl', 'dots'];

function showScene(name, p, art, key) {
  const sc = (SCENES[name] || SCENES.glow)(p, art);
  const el = document.createElement('div');
  el.className = `scene t-${name}`; el.innerHTML = sc.html;
  for (const [k, v] of Object.entries(sc.vars || {})) el.style.setProperty(k, v);
  $('scenes').appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  const old = [...$('scenes').children].filter((x) => x !== el);
  setTimeout(() => old.forEach((x) => x.remove()), 1300);
  stage.style.setProperty('--ink', sc.ink); stage.style.setProperty('--sub', sc.sub); stage.style.setProperty('--knob', sc.knob);
  stage.classList.toggle('centre', !!sc.centre); stage.classList.toggle('wide', !!sc.wide); barW = 0;
  if (name === 'arcs') { el.classList.add('draw'); }
  curTheme = name;
  return el;
}

// ---------------------------------------------------------------- state from the phone
async function apply(s) {
  S = s; skew = s.now ? Date.now() - s.now : 0;
  sound(!!s.audio);
  $('from').style.display = s.phone ? 'flex' : 'none'; $('fromName').textContent = s.phone || '';
  const m = s.media;
  if (!m || !m.title) {
    if (curTheme !== 'idle') { showScene('idle'); curKey = ''; }
    $('ui').style.opacity = 0; $('idle').style.display = 'block';
    $('idleH').textContent = s.phone ? `Connected to ${s.phone}` : 'Mood PLAY'; $('idleP').textContent = 'Play something and it shows up here';
    return;
  }
  $('idle').style.display = 'none'; $('ui').style.opacity = 1;
  const key = m.title + '|' + m.artist;
  const want = s.theme && s.theme !== 'auto' ? s.theme : null;
  if (key !== curKey) {
    curKey = key;
    pal = await palette(m.art);
    if (key !== curKey) return; // a newer song arrived while the cover loaded
    const name = want || autoTheme(pal, key);
    const el = showScene(name, pal, m.art, key);
    if (name === 'shards' && el) { el.classList.add('burst'); setTimeout(() => el.classList.remove('burst'), 60); }
    $('art').innerHTML = m.art ? `<img src="${esc(m.art)}" alt="">` : '<div class="noart">♪</div>';
    $('art').classList.remove('flip'); void $('art').offsetWidth; $('art').classList.add('flip');
    const long = (m.title || '').length > 16;
    $('meta').innerHTML = `<div class="title in ${long ? 'long' : ''}">${esc(m.title)}</div><div class="artist in2">${esc(m.artist || '')}</div>${m.album ? `<div class="album in3">${esc(m.album)}</div>` : ''}`;
  } else if (want && want !== curTheme) showScene(want, pal, m.art, key);
  else if (!want && s.themeChanged) showScene(autoTheme(pal, key), pal, m.art, key);
  // play / pause, repeat, shuffle
  $('playIcon').innerHTML = m.playing ? '<rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/>' : '<path d="M6 4v16l14-8z"/>';
  const rep = $('cRepeat'); rep.classList.toggle('dim', m.repeat == null); rep.classList.toggle('active', m.repeat === 'all' || m.repeat === 'one'); rep.classList.toggle('one', m.repeat === 'one');
  const sh = $('cShuffle'); sh.classList.toggle('dim', m.shuffle == null); sh.classList.toggle('active', !!m.shuffle);
  const rec = document.getElementById('record'); if (rec) { rec.classList.add('out'); rec.classList.toggle('spin', !!m.playing); }
  tick();
}
let barW = 0;
function pos() { const m = S && S.media; if (!m) return 0; const p = m.playing ? m.pos + (Date.now() - skew - m.at) : m.pos; return m.dur ? Math.min(m.dur, Math.max(0, p)) : Math.max(0, p); }
function tick() {
  const m = S && S.media; if (!m) return;
  const p = pos(), f = m.dur ? p / m.dur : 0;
  $('tA').textContent = clock(p); $('tB').textContent = m.dur ? clock(m.dur) : '--:--';
  const w = barW || ($('bar').offsetWidth); barW = w;
  $('knob').style.transform = `translateX(${(f * w).toFixed(1)}px)`; $('done').style.transform = `scaleX(${f.toFixed(4)})`;
}
setInterval(tick, 500);

// ---------------------------------------------------------------- the sound (from the phone, over Wi-Fi)
let snd = null, needTap = false, sndWant = false;
function sound(on) {
  sndWant = on && !DEMO;
  $('sndIcon').classList.toggle('on', sndWant);
  if (sndWant && !snd) {
    snd = new Audio(BASE + 'audio?' + Date.now()); snd.preload = 'auto';
    const again = () => { if (snd) { snd.src = ''; snd = null; } if (sndWant) setTimeout(() => sound(sndWant), 1500); };
    snd.onerror = again; snd.onended = again;
    snd.play().catch(() => { needTap = true; toast('Press OK on the remote to hear it on the TV'); });
  } else if (!sndWant && snd) { snd.pause(); snd.src = ''; snd = null; }
}
// Live streams pile up delay in the browser: if the TV drifts more than 3 s behind, start again at "now".
setInterval(() => { if (snd && snd.buffered.length && snd.buffered.end(snd.buffered.length - 1) - snd.currentTime > 3) { snd.pause(); snd.src = ''; snd = null; sound(sndWant); } }, 5000);

// ---------------------------------------------------------------- remote control
let lastKey = 0;
function send(c, extra) {
  if (DEMO) return toast(c);
  fetch(BASE + 'cmd?c=' + encodeURIComponent(c) + (extra || ''), { method: 'POST', cache: 'no-store' }).catch(() => toast('Can’t reach your phone'));
}
document.querySelectorAll('.ctl').forEach((b) => b.addEventListener('click', () => { b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 150); send(b.dataset.c); }));
const order = () => [...document.querySelectorAll('.ctl')];
addEventListener('keydown', (e) => {
  document.body.classList.add('keys'); lastKey = Date.now();
  if (needTap && snd) { needTap = false; snd.play().catch(() => {}); if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); return; } }
  const k = e.key, code = e.keyCode, list = order(), i = list.indexOf(document.activeElement);
  if (k === 'ArrowRight' || code === 39) { (list[Math.min(list.length - 1, i + 1)] || list[2]).focus(); e.preventDefault(); }
  else if (k === 'ArrowLeft' || code === 37) { (list[Math.max(0, i - 1)] || list[2]).focus(); e.preventDefault(); }
  else if (k === 'Enter' || code === 13) { (document.activeElement && document.activeElement.dataset.c ? document.activeElement : $('cPlay')).click(); e.preventDefault(); }
  else if (k === 'MediaPlayPause' || code === 179 || code === 10252 || code === 415 || code === 19) { send('toggle'); e.preventDefault(); }
  else if (k === 'MediaTrackNext' || code === 176 || code === 10233 || code === 417) { send('next'); e.preventDefault(); }
  else if (k === 'MediaTrackPrevious' || code === 177 || code === 10232 || code === 412) { send('prev'); e.preventDefault(); }
});
setInterval(() => { if (Date.now() - lastKey > 6000) document.body.classList.remove('keys'); }, 1000);
setTimeout(() => $('cPlay').focus(), 300);
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }

// ---------------------------------------------------------------- live link to the phone
let lastMsg = Date.now();
function poll() {
  fetch(BASE + 'state', { cache: 'no-store' }).then((r) => { if (r.status === 404) throw new Error('ended'); return r.json(); })
    .then((s) => { lastMsg = Date.now(); apply(s); }).catch((e) => { if (String(e.message) === 'ended') ended(); })
    .finally(() => setTimeout(poll, 1000));
}
function listen() {
  if (!window.EventSource) return poll();
  const es = new EventSource(BASE + 'events');
  es.onmessage = (e) => { lastMsg = Date.now(); try { apply(JSON.parse(e.data)); } catch (x) {} };
  es.addEventListener('ping', () => { lastMsg = Date.now(); }); // the phone's heartbeat: still connected, nothing new
  es.onopen = () => { lastMsg = Date.now(); };
  es.onerror = () => { es.close(); setTimeout(() => fetch(BASE + 'state', { cache: 'no-store' }).then((r) => (r.status === 404 ? ended() : listen())).catch(() => setTimeout(listen, 3000)), 1500); };
}
function ended() { showScene('idle'); $('ui').style.opacity = 0; $('idle').style.display = 'block'; $('idleH').textContent = 'Mood PLAY has ended'; $('idleP').textContent = 'Start it again from Nebula on your phone'; $('from').style.display = 'none'; }
setInterval(() => { if (!DEMO && Date.now() - lastMsg > 40000) toast('Reconnecting to your phone…'); }, 10000);

(function measure() {
  if (Q.get('lite') === '1') return document.body.classList.add('lite');
  let n = 0, t0 = 0, worst = 0, last = 0;
  function f(t) { if (!t0) t0 = t; if (last) worst = Math.max(worst, t - last); last = t; n++;
    if (t - t0 < 5000) requestAnimationFrame(f); else if (n / ((t - t0) / 1000) < 24) document.body.classList.add('lite'); }
  setTimeout(() => requestAnimationFrame(f), 2500); // after the first scene has settled
})();

if (DEMO) {
  // previews: ?demo=1&t=<title>&a=<artist>&art=<url>&theme=<name>|auto&playing=1
  const m = Q.get('t') ? { title: Q.get('t'), artist: Q.get('a') || '', album: Q.get('al') || '', art: Q.get('art') || '', playing: Q.get('playing') !== '0', pos: 70000, dur: 250000, at: Date.now(), repeat: 'all', shuffle: false } : null;
  apply({ now: Date.now(), phone: Q.get('phone') || 'Galaxy S24', theme: Q.get('theme') || 'auto', media: m });
} else listen();
</script>
</body>
